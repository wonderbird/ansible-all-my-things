# Static profile topology. Defines the `base` supergroup whose children are the
# per-profile groups populated by playbooks/tasks/create/<provider>.yml. Merged
# with the *_autogenerated.yml files ONLY by the directory inventory
# (ansible.cfg: inventory = ./inventories), so `base` inherits every
# basic/desktop host without any change to the autogenerated files. Run
# configure-profile.yml against the directory inventory (the default) — do NOT
# pass -i <single autogenerated file>, which omits this file, empties the base
# group, and trips the preflight guard in playbooks/configure-profile.yml.
base:
  children:
    basic:
    desktop:
