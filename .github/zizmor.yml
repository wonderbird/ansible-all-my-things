# zizmor configuration — single-tier GitHub Actions pinning policy
#
# Only the unpinned-uses audit is enabled. All other zizmor audits are
# disabled to keep this job focused on pinning enforcement only.
# (Principle IV — YAGNI)
#
# Every action reference must be a 40-character commit SHA carrying a full
# `# vX.Y.Z` comment, whoever publishes it and whatever permissions its job
# holds. The audit needs no policy of its own: zizmor's implicit
# "*": hash-pin default applies to any `uses:` clause matching no rule.
#
# See docs/architecture/decisions/007-single-tier-action-pinning.md

rules:
  # Disable all other audits — this workflow enforces pinning only.
  # dependabot-cooldown: zizmor discovers dependabot.yml independent of the
  # `inputs` directory target; disable explicitly so this pinning-only audit
  # stays out of scope (added in zizmor v1.15.0, fires regardless of inputs).
  dependabot-cooldown:
    disable: true
  artipacked:
    disable: true
  excessive-permissions:
    disable: true
  template-injection:
    disable: true
  dangerous-triggers:
    disable: true
  job-container-escape:
    disable: true
  known-vulnerable-actions:
    disable: true
  ref-confusion:
    disable: true
  self-hosted-runner:
    disable: true
  unpinned-images:
    disable: true
  unpinned-tools:
    disable: true
  unredacted-secrets:
    disable: true
  use-trusted-publishing:
    disable: true
  hardcoded-container-credentials:
    disable: true
  impostor-commit:
    disable: true
  cache-poisoning:
    disable: true
  overprovisioned-secrets:
    disable: true
