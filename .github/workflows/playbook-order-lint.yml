# SPDX-License-Identifier: MIT-0
---
name: Playbook Order Lint

# Enforce the apply-phase invariants of
# playbooks/update-versions/perform-updates.yml. The invariants, why each
# exists, and the checker's design are documented in
# scripts/version-update-order/README.md.
#
# Tool: scripts/version-update-order/check-version-update-order.py
# (no network, no Podman, no pip)

on:
  push:
    branches: ["main"]
    paths:
      - "playbooks/**"
      - "scripts/version-update-order/**"
      - ".github/workflows/playbook-order-lint.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "playbooks/**"
      - "scripts/version-update-order/**"
      - ".github/workflows/playbook-order-lint.yml"
  workflow_dispatch:

jobs:
  playbook-order-lint:
    name: Check version-update apply order
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Test the apply-order checker
        run: >-
          python3
          scripts/version-update-order/test_check_version_update_order.py

      - name: Check version-update apply order
        run: >-
          python3 scripts/version-update-order/check-version-update-order.py
          playbooks/update-versions/perform-updates.yml
