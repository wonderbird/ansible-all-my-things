# SPDX-License-Identifier: MIT-0
# Select inside the workflow so the explicit gate can distinguish skips from failures.
# Run the full suite weekly to catch upstream drift even without repository changes.
---
name: Molecule Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened, edited]
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Metadata-only edits must not replace even a pending run for the same PR.
  group: >-
    ${{ github.workflow }}-${{ github.event_name }}-${{
      (github.event.action != 'edited' || github.event.changes.base != null)
      && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: Select Molecule roles
    if: github.event.action != 'edited' || github.event.changes.base != null
    runs-on: ubuntu-24.04
    outputs:
      roles: ${{ steps.select.outputs.roles }}
      has_roles: ${{ steps.select.outputs.has_roles }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A single push can span more than one commit.
          fetch-depth: ${{ github.event_name == 'push' && '0' || '2' }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Install selection dependency
        run: pip install "$(grep '^PyYAML' requirements.txt)"

      - name: Test scenario selection
        run: |
          python -m unittest discover -s scripts -p test_molecule_references.py
          python -m unittest discover -s scripts -p test_select_molecule_roles.py

      - name: Select scenarios
        id: select
        shell: bash
        env:
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: |
          args=()
          if [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            # The merge commit's first parent is the PR base tested by this run.
            args=(--base HEAD^1)
          elif [[ "$GITHUB_EVENT_NAME" == push ]]; then
            if [[ "$PUSH_FORCED" == true || "$PUSH_BEFORE" =~ ^0+$ ]]; then
              echo 'New or force-pushed branch; selecting all Molecule scenarios.'
            else
              : "${PUSH_BEFORE:?Missing before SHA for push}"
              args=(--base "$PUSH_BEFORE")
            fi
          fi
          roles=$(python scripts/select_molecule_roles.py "${args[@]}")
          printf 'roles=%s\n' "$roles" >> "$GITHUB_OUTPUT"
          if [[ -n "$roles" ]]; then
            echo 'has_roles=true' >> "$GITHUB_OUTPUT"
            printf 'Selected Molecule roles: %s\n' "$roles"
          else
            echo 'has_roles=false' >> "$GITHUB_OUTPUT"
            echo 'No affected Molecule roles; skipping tests.'
          fi

  molecule:
    name: Run Molecule tests
    needs: changes
    if: needs.changes.outputs.has_roles == 'true'
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Configure rootless Podman
        run: echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"

      - name: Run Molecule tests
        shell: bash
        run: |
          read -r -a roles <<< "$MOLECULE_ROLES"
          if (( ${#roles[@]} == 0 )); then
            echo 'ERROR: selection reported affected roles but supplied no role names.' >&2
            exit 1
          fi
          ./scripts/test-molecule-all.sh --roles "${roles[@]}"
        env:
          MOLECULE_ROLES: ${{ needs.changes.outputs.roles }}
          ANSIBLE_FORCE_COLOR: "true"
          PY_COLORS: "1"

  gate:
    name: >-
      ${{ github.event.action == 'edited' && github.event.changes.base == null
      && 'Molecule metadata edit' || 'Molecule CI gate' }}
    needs: [changes, molecule]
    if: always() && (github.event.action != 'edited' || github.event.changes.base != null)
    runs-on: ubuntu-24.04
    steps:
      - name: Verify selection and test outcomes
        shell: bash
        env:
          SELECTION_RESULT: ${{ needs.changes.result }}
          HAS_ROLES: ${{ needs.changes.outputs.has_roles }}
          TEST_RESULT: ${{ needs.molecule.result }}
        run: |
          case "$SELECTION_RESULT:$HAS_ROLES:$TEST_RESULT" in
            success:true:success | success:false:skipped) ;;
            *)
              printf 'Molecule CI failed: selection=%s, has_roles=%s, tests=%s\n' \
                "$SELECTION_RESULT" "$HAS_ROLES" "$TEST_RESULT" >&2
              exit 1
              ;;
          esac
