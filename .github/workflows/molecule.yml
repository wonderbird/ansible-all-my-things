# SPDX-License-Identifier: MIT-0
---
name: Molecule Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  molecule:
    name: Run Molecule tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        # SHA-pinned: Tier B tightening. A floating @v7 is permitted here, but
        # Dependabot rewrites it to a patch tag (@v7.0.1) on a patch-level
        # release, which satisfies neither tier. A SHA pin is stable under
        # that rewrite because Dependabot co-updates SHA and comment instead.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install Ansible collections
        run: ansible-galaxy collection install -r requirements.yml

      - name: Configure rootless Podman
        run: echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"

      - name: Run Molecule tests
        run: ./scripts/test-molecule-all.sh
        env:
          ANSIBLE_FORCE_COLOR: "true"
          PY_COLORS: "1"
