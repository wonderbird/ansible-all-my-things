# SPDX-License-Identifier: MIT-0
---
name: Version Update Lint

# Guard the version-update mechanism. Why each rule exists is documented in
# docs/architecture/version-update-playbooks.md.
#
# Jobs:
# - version-update-lint runs the static checks and their tests (no network):
#   check-write-pins-bypass.py, because a task that edits a role defaults file
#   directly skips the check that the pin exists exactly once; and
#   check-fetch-call-identity.py, because a fetch file that stamps fetched_for
#   outside the task writing its output lets a skipped output keep the previous
#   tool's value while the caller's assert still passes.
# - update-versions-harness installs ansible-core and runs each localhost test
#   harness named in the matrix below, and syntax-checks the playbook itself. It
#   selects playbooks/update-versions/tests/ansible.cfg instead of the
#   repository root ansible.cfg, whose vault password script exits non-zero
#   without a vault secret, and fork pull requests receive no secrets.

on:
  push:
    branches: ["main"]
    paths:
      - "playbooks/**"
      - "scripts/**"
      - ".github/workflows/version-update-lint.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "playbooks/**"
      - "scripts/**"
      - ".github/workflows/version-update-lint.yml"
  workflow_dispatch:

jobs:
  version-update-lint:
    name: Check the version-update write-pins ban
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Test the write-pins bypass check
        run: >-
          python3
          scripts/version-update-order/test_check_write_pins_bypass.py

      - name: Check that no task edits a file outside write-pins
        run: >-
          python3 scripts/version-update-order/check-write-pins-bypass.py
          playbooks/update-versions

      # the call-identity checker parses task files, which needs PyYAML; the
      # write-pins check above is textual and needs nothing
      - name: Install PyYAML
        run: pip install "$(grep -E '^PyYAML' requirements.txt)"

      - name: Test the fetch call-identity check
        run: >-
          python3
          scripts/fetch-call-identity/test_check_fetch_call_identity.py

      - name: Check that every fetch file stamps its outputs
        run: >-
          python3 scripts/fetch-call-identity/check-fetch-call-identity.py
          playbooks/update-versions

  update-versions-harness:
    name: Test ${{ matrix.harness }} task file
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      ANSIBLE_CONFIG: playbooks/update-versions/tests/ansible.cfg
    strategy:
      fail-fast: false
      matrix:
        harness:
          - write-pins
          - tool-isolation
          - tool-registry
          - fixture-registry-smoke
          - failure-source
          - fetch-call-identity

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Install ansible-core
        run: pip install "$(grep -E '^ansible-core' requirements.txt)"

      - name: Check the syntax of the version-update playbook
        run: >-
          ansible-playbook --syntax-check
          playbooks/update-versions/perform-updates.yml

      - name: Run the ${{ matrix.harness }} harness
        run: >-
          ansible-playbook
          playbooks/update-versions/tests/test-${{ matrix.harness }}.yml
