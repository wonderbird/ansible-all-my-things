---
- name: Validate required variables
  ansible.builtin.assert:
    that:
      - bun_version | length > 0
      - bun_version is match('^bun-v[0-9]+\.[0-9]+\.[0-9]+')
      - bun_sha256_x64 | length == 64
      - bun_sha256_aarch64 | length == 64
    fail_msg: >-
      Variable validation failed: bun_version must be a non-empty upstream
      release tag of the form bun-v<major>.<minor>.<patch> (e.g. bun-v1.4.2);
      bun_sha256_x64 and bun_sha256_aarch64 must each be a 64-character
      SHA-256 hex digest.

- name: Verify supported processor architecture
  ansible.builtin.assert:
    that:
      - ansible_facts['architecture'] in ['x86_64', 'aarch64']
    fail_msg: >-
      Unsupported processor architecture: {{ ansible_facts['architecture'] }}.
      Supported architectures are: x86_64, aarch64.

- name: Set Bun target architecture
  ansible.builtin.set_fact:
    _bun_arch: "{{ 'x64' if ansible_facts['architecture'] == 'x86_64' else 'aarch64' }}"

- name: Check if Bun binary is installed
  ansible.builtin.stat:
    path: "{{ bun_install_path }}"
  register: _bun_binary_stat

- name: Get installed Bun version
  ansible.builtin.command:
    cmd: "{{ bun_install_path }} --version"
  register: _bun_installed_version
  changed_when: false
  when: _bun_binary_stat.stat.exists

- name: Determine if Bun installation is required
  ansible.builtin.set_fact:
    _bun_needs_install: >-
      {{ not _bun_binary_stat.stat.exists or
         (bun_version | regex_replace('^bun-v', '')) not in
         (_bun_installed_version.stdout | default('')) }}

- name: Install unzip to extract the Bun release archive
  # Upstream publishes the linux builds as .zip only, and ansible.builtin
  # .unarchive shells out to unzip for that format. Tool prerequisites are
  # not baked into the base image — each role installs its own.
  ansible.builtin.apt:
    name: unzip
    state: present
    update_cache: true
  when: _bun_needs_install

- name: Download Bun release archive
  ansible.builtin.get_url:
    url: >-
      https://github.com/oven-sh/bun/releases/download/{{ bun_version }}/bun-linux-{{ _bun_arch }}.zip
    dest: "/tmp/bun-{{ bun_version }}-linux-{{ _bun_arch }}.zip"
    mode: '0644'
    checksum: "sha256:{{ bun_sha256_x64 if _bun_arch == 'x64' else bun_sha256_aarch64 }}"
  when: _bun_needs_install

- name: Create staging directory for Bun extraction
  ansible.builtin.file:
    path: "/tmp/bun-{{ bun_version }}-linux-{{ _bun_arch }}"
    state: directory
    mode: '0755'
  when: _bun_needs_install

- name: Extract Bun release archive
  ansible.builtin.unarchive:
    src: "/tmp/bun-{{ bun_version }}-linux-{{ _bun_arch }}.zip"
    dest: "/tmp/bun-{{ bun_version }}-linux-{{ _bun_arch }}"
    remote_src: true
  when: _bun_needs_install

- name: Install Bun binary
  ansible.builtin.copy:
    src: "/tmp/bun-{{ bun_version }}-linux-{{ _bun_arch }}/bun-linux-{{ _bun_arch }}/bun"
    dest: "{{ bun_install_path }}"
    remote_src: true
    mode: '0755'
    owner: root
    group: root
  when: _bun_needs_install

- name: Link bunx to the Bun binary
  ansible.builtin.file:
    src: "{{ bun_install_path }}"
    dest: "{{ bun_bunx_path }}"
    state: link
    owner: root
    group: root
