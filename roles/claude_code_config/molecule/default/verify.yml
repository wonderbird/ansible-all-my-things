---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Check CLAUDE_PLUGIN_ROOT is configured in testuser's .bashrc
      ansible.builtin.shell: grep -q 'CLAUDE_PLUGIN_ROOT=/home/testuser/.claude/plugins' /home/testuser/.bashrc
      changed_when: false
      failed_when: false
      register: claude_plugin_root_val

    - name: Assert CLAUDE_PLUGIN_ROOT is configured in .bashrc
      ansible.builtin.assert:
        that:
          - claude_plugin_root_val.rc == 0
        fail_msg: "CLAUDE_PLUGIN_ROOT not found in testuser's .bashrc"
        success_msg: "CLAUDE_PLUGIN_ROOT is configured in testuser's .bashrc"

    - name: Run rtk init -g as testuser
      ansible.builtin.command:
        cmd: rtk init -g
      become: true
      become_user: testuser
      changed_when: false
      register: rtk_init_result

    - name: Assert rtk init -g succeeded
      ansible.builtin.assert:
        that:
          - rtk_init_result.rc == 0
        fail_msg: "rtk init -g failed with rc {{ rtk_init_result.rc }}"
        success_msg: "rtk init -g succeeded for testuser"

    - name: Check Oh My Claude Code plugin cache directory exists
      ansible.builtin.stat:
        path: /home/testuser/.claude/plugins/cache/omc/oh-my-claudecode
      register: omc_cache_stat

    - name: Assert Oh My Claude Code plugin is installed
      ansible.builtin.assert:
        that:
          - omc_cache_stat.stat.exists
        fail_msg: "Oh My Claude Code not found at /home/testuser/.claude/plugins/cache/omc/oh-my-claudecode"
        success_msg: "Oh My Claude Code found at /home/testuser/.claude/plugins/cache/omc/oh-my-claudecode"

    - name: Read settings.json
      ansible.builtin.slurp:
        src: /home/testuser/.claude/settings.json
      register: settings_file

    - name: Assert settings.json contains required keys
      ansible.builtin.assert:
        that:
          - settings.env.CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS == "1"
          - settings.env.CLAUDE_CODE_SPAWN_BACKEND == "tmux"
          - settings.teammateMode == "tmux"
          - settings.env.DISABLE_AUTOUPDATER == "1"
          - settings.env.DISABLE_UPDATES == "1"
        fail_msg: "settings.json missing required agent-team keys or auto-update-disable keys"
        success_msg: "settings.json contains all required agent-team keys and auto-update-disable keys"
      vars:
        settings: "{{ settings_file.content | b64decode | from_json }}"

    - name: Check rtk hook is configured in settings.json
      ansible.builtin.shell: >
        jq -e '.hooks.PreToolUse[] | select(.matcher == "Bash") | .hooks[] |
        select(.command == "rtk hook claude")' /home/testuser/.claude/settings.json
      changed_when: false
      failed_when: false
      register: rtk_hook_check

    - name: Assert rtk PreToolUse hook is present in settings.json
      ansible.builtin.assert:
        that:
          - rtk_hook_check.rc == 0
        fail_msg: "rtk hook claude not found in settings.json PreToolUse hooks"
        success_msg: "rtk hook claude configured in settings.json"

    - name: Check bd-guard hook is configured in settings.json
      ansible.builtin.shell: >
        jq -e '.hooks.PreToolUse[] | select(.matcher == "Bash") | .hooks[] |
        select(.command | contains("bd list --all"))' /home/testuser/.claude/settings.json
      changed_when: false
      failed_when: false
      register: bd_guard_hook_check

    - name: Assert bd-guard PreToolUse hook is present in settings.json
      ansible.builtin.assert:
        that:
          - bd_guard_hook_check.rc == 0
        fail_msg: "bd list --all guard hook not found in settings.json PreToolUse hooks"
        success_msg: "bd list --all guard hook configured in settings.json"

    - name: Check context7 plugin cache directory exists
      ansible.builtin.stat:
        path: /home/testuser/.claude/plugins/cache/claude-plugins-official/context7
      register: context7_cache_stat

    - name: Assert context7 plugin cache directory is present
      ansible.builtin.assert:
        that:
          - context7_cache_stat.stat.exists
        fail_msg: "context7 plugin cache not found at /home/testuser/.claude/plugins/cache/claude-plugins-official/context7"
        success_msg: "context7 plugin cache found at /home/testuser/.claude/plugins/cache/claude-plugins-official/context7"

    - name: Check context7 MCP server is registered
      ansible.builtin.shell: /home/testuser/.local/bin/claude mcp list
      become: true
      become_user: testuser
      changed_when: false
      register: mcp_list_result

    - name: Assert context7 MCP server is auto-registered
      ansible.builtin.assert:
        that:
          - "'context7' in mcp_list_result.stdout"
        fail_msg: "context7 not found in 'claude mcp list' output"
        success_msg: "context7 MCP server is registered"

    - name: Check exa MCP server is configured
      ansible.builtin.shell: /home/testuser/.local/bin/claude mcp list
      become: true
      become_user: testuser
      changed_when: false
      register: exa_mcp_list_result

    - name: Assert exa MCP server is registered
      ansible.builtin.assert:
        that:
          - "'exa' in exa_mcp_list_result.stdout"
        fail_msg: "exa MCP server not found in 'claude mcp list' output"
        success_msg: "exa MCP server is configured"

    - name: Check commit skill symlink exists
      ansible.builtin.stat:
        path: /home/testuser/.claude/skills/commit
        follow: false
      register: commit_skill_link_stat

    - name: Assert commit skill symlink is present and points into clone
      ansible.builtin.assert:
        that:
          - commit_skill_link_stat.stat.islnk
          - commit_skill_link_stat.stat.lnk_source == "/home/testuser/Documents/Cline/ai-agent-workspace/.claude/skills/commit"
        fail_msg: "commit skill symlink missing or pointing to wrong target"
        success_msg: "commit skill symlink present and correct"

    - name: Check commit skill symlink is not dangling
      ansible.builtin.stat:
        path: /home/testuser/.claude/skills/commit
        follow: true
      register: commit_skill_follow_stat

    - name: Assert commit skill symlink resolves
      ansible.builtin.assert:
        that:
          - commit_skill_follow_stat.stat.exists
        fail_msg: "commit skill symlink is dangling"
        success_msg: "commit skill symlink resolves to real directory"

    - name: Check oh-my-claudecode source repository exists
      ansible.builtin.stat:
        path: /home/testuser/Documents/Cline/oh-my-claudecode/.git
      register: omc_src_stat

    - name: Assert oh-my-claudecode source repository is cloned
      ansible.builtin.assert:
        that:
          - omc_src_stat.stat.exists
        fail_msg: "oh-my-claudecode source repo not found at /home/testuser/Documents/Cline/oh-my-claudecode/.git"
        success_msg: "oh-my-claudecode source repo found at /home/testuser/Documents/Cline/oh-my-claudecode/.git"

    - name: Check omc CLI is available
      ansible.builtin.command: omc --version
      become: true
      become_user: testuser
      register: omc_version_result
      changed_when: false

    - name: Assert omc CLI is available
      ansible.builtin.assert:
        that:
          - omc_version_result.rc == 0
        fail_msg: "omc --version failed with rc {{ omc_version_result.rc }}"
        success_msg: "omc CLI available"
