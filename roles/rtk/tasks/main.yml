---
- name: Check if rtk binary already exists
  ansible.builtin.stat:
    path: /usr/local/bin/rtk
  register: rtk_stat

- name: Get installed rtk version
  ansible.builtin.command:
    cmd: /usr/local/bin/rtk --version
  when: rtk_stat.stat.exists
  register: _rtk_installed_version
  changed_when: false

# An unreadable version would make the gate below reinstall on every run,
# so it stops the play instead (Constitution Principle XII).
- name: Assert installed rtk reports a parseable version
  ansible.builtin.assert:
    that:
      - _rtk_installed_version.stdout is match('^rtk [0-9]+\.[0-9]+\.[0-9]+( |$)')
    fail_msg: >-
      /usr/local/bin/rtk --version printed '{{ _rtk_installed_version.stdout }}',
      which does not start with "rtk <semver>"; cannot tell whether the
      installed version matches rtk_version {{ rtk_version }}. Remove
      /usr/local/bin/rtk to let the role reinstall.
    quiet: true
  when: rtk_stat.stat.exists

# Install unless rtk exists and reports exactly the pinned version, so a
# pin bump upgrades an existing host. The version is compared as a whole
# token, so a pin never matches a longer version that merely starts with it.
- name: Determine if rtk installation is required
  ansible.builtin.set_fact:
    _rtk_needs_install: >-
      {{ not (rtk_stat.stat.exists
              and _rtk_installed_version.stdout
                  is match('^rtk ' ~ ((rtk_version | regex_replace('^v', '')) | regex_escape) ~ '( |$)')) }}

# rtk_version is a static pin (see below), not a live upstream query. The gate
# above is a version compare rather than a file-presence check: presence alone
# would never reach a host that already has an older rtk when the pin is
# bumped. Once the installed version equals the pin the block is skipped,
# because unarchive has no creates:-based idempotency of its own and would
# otherwise re-download and re-extract the same archive on every converge.
- name: Install rtk from a checksum-verified release archive
  when: _rtk_needs_install | bool
  block:
    # Only architectures listed in rtk_platform_map are supported.
    - name: Verify supported processor architecture
      ansible.builtin.assert:
        that: "ansible_facts['architecture'] in rtk_platform_map"
        fail_msg: >
          Unsupported processor architecture: {{ ansible_facts['architecture'] }}.
          Supported architectures are: {{ rtk_platform_map.keys() | list }}.

    # rtk_version is a static pin (roles/rtk/defaults/main.yml), refreshed only
    # by playbooks/update-versions/perform-updates.yml -- see Constitution
    # Principle II. checksum: is a literal instead of a live checksums.txt URL
    # fetch so re-converge never silently re-verifies against a newer release.
    - name: Download and checksum-verify the rtk release archive
      ansible.builtin.get_url:
        url: "https://github.com/rtk-ai/rtk/releases/download/{{ rtk_version }}/{{ rtk_platform_map[ansible_facts['architecture']] }}"
        dest: "/tmp/{{ rtk_platform_map[ansible_facts['architecture']] }}"
        checksum: "sha256:{{ (rtk_sha256_x86_64_musl if ansible_facts['architecture'] == 'x86_64' else rtk_sha256_aarch64_gnu) }}"
        mode: '0644'

    - name: Install the verified rtk binary to /usr/local/bin
      ansible.builtin.unarchive:
        src: "/tmp/{{ rtk_platform_map[ansible_facts['architecture']] }}"
        dest: /usr/local/bin
        remote_src: true
        mode: '0755'
      become: true
