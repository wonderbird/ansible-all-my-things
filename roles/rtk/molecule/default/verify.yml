---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Load role defaults for version reference
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../defaults/main.yml"

    - name: Check rtk binary exists
      ansible.builtin.stat:
        path: /usr/local/bin/rtk
      register: rtk_stat

    - name: Assert rtk is installed
      ansible.builtin.assert:
        that:
          - rtk_stat.stat.exists
        fail_msg: "rtk binary not found at /usr/local/bin/rtk"
        success_msg: "rtk binary found at /usr/local/bin/rtk"

    - name: Get installed rtk version
      ansible.builtin.command:
        cmd: /usr/local/bin/rtk --version
      register: _verify_rtk_version
      changed_when: false

    # prepare.yml planted a stale rtk; reporting the pin proves converge
    # replaced it (the upgrade path) instead of skipping on file presence.
    - name: Assert rtk reports exactly the pinned version
      ansible.builtin.assert:
        that:
          - (_verify_rtk_version.stdout.split() + ['', '', ''])[1] == (rtk_version | regex_replace('^v', ''))
        fail_msg: >-
          Expected rtk version {{ rtk_version | regex_replace('^v', '') }} but got
          '{{ _verify_rtk_version.stdout }}'
        success_msg: "rtk reports {{ _verify_rtk_version.stdout }}, matching the pin"
