---
# -----
# Install beads viewer (bv) from the Dicklesworthstone/beads_viewer GitHub
# release
#
# beads_viewer_version and the per-architecture checksums are static pins (see
# roles/beads_viewer/defaults/main.yml), refreshed only by
# playbooks/update-versions/perform-updates.yml -- there is no live
# checksums.txt fetch left; get_url's checksum: param verifies against the
# pinned literal. Archive filenames embed the version (e.g.
# bv_0.24.1_linux_amd64.tar.gz), so the stripped variant is derived in-role
# from the single pinned raw tag. Same static-pin, no-partial-file,
# system-wide semantics as bd (roles/beads_go). The install is gated on
# `bv --version` matching the pin, not on the file existing, so a pin bump
# upgrades an existing host.
# -----

- name: Check if bv binary already exists
  ansible.builtin.stat:
    path: /usr/local/bin/bv
  register: bv_stat

- name: Get installed bv version
  ansible.builtin.command:
    cmd: /usr/local/bin/bv --version
  when: bv_stat.stat.exists
  register: _bv_installed_version
  changed_when: false

# An unreadable version would make the gate below reinstall on every run,
# so it stops the play instead (Constitution Principle XII).
- name: Assert installed bv reports a parseable version
  ansible.builtin.assert:
    that:
      - _bv_installed_version.stdout is match('^bv v[0-9]+\.[0-9]+\.[0-9]+( |$)')
    fail_msg: >-
      /usr/local/bin/bv --version printed '{{ _bv_installed_version.stdout }}',
      which does not start with "bv v<semver>"; cannot tell whether the
      installed version matches beads_viewer_version {{ beads_viewer_version }}. Remove
      /usr/local/bin/bv to let the role reinstall.
    quiet: true
  when: bv_stat.stat.exists

# Install unless bv exists and reports exactly the pinned version, so a
# pin bump upgrades an existing host. The version is compared as a whole
# token, so a pin never matches a longer version that merely starts with it.
- name: Determine if bv installation is required
  ansible.builtin.set_fact:
    _bv_needs_install: >-
      {{ not (bv_stat.stat.exists
              and _bv_installed_version.stdout
                  is match('^bv v' ~ (beads_viewer_version | regex_replace('^v', '') | regex_escape) ~ '( |$)')) }}

- name: Install bv from a checksum-verified release archive
  when: _bv_needs_install | bool
  become: true
  block:
    - name: Verify supported processor architecture for bv
      ansible.builtin.assert:
        that: "ansible_facts['architecture'] in beads_viewer_platform_map"
        fail_msg: >
          Unsupported processor architecture: {{ ansible_facts['architecture'] }}.
          Supported architectures are: {{ beads_viewer_platform_map.keys() | list }}.

    # beads_viewer_version is a static pin (roles/beads_viewer/defaults/main.yml),
    # refreshed only by playbooks/update-versions/perform-updates.yml -- see
    # Constitution Principle II. The stripped filename-variant is still
    # derived in-role from the single pinned raw tag.
    - name: Derive stripped bv version from pinned tag
      ansible.builtin.set_fact:
        bv_version: "{{ beads_viewer_version | regex_replace('^v', '') }}"

    - name: Download and checksum-verify bv archive
      ansible.builtin.get_url:
        url: https://github.com/Dicklesworthstone/beads_viewer/releases/download/{{ beads_viewer_version }}/bv_{{ bv_version }}_linux_{{ beads_viewer_platform_map[ansible_facts['architecture']] }}.tar.gz
        dest: /tmp/bv_{{ bv_version }}_linux_{{ beads_viewer_platform_map[ansible_facts['architecture']] }}.tar.gz
        checksum: "sha256:{{ (beads_viewer_sha256_amd64 if ansible_facts['architecture'] == 'x86_64' else beads_viewer_sha256_arm64) }}"
        mode: '0644'

    - name: Extract bv binary to /usr/local/bin
      ansible.builtin.unarchive:
        src: /tmp/bv_{{ bv_version }}_linux_{{ beads_viewer_platform_map[ansible_facts['architecture']] }}.tar.gz
        dest: /usr/local/bin
        remote_src: true
        mode: '0755'
        include:
          - bv
