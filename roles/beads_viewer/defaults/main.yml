---
# Pinned bv (Dicklesworthstone/beads_viewer) release tag (v-prefixed). See
# https://github.com/Dicklesworthstone/beads_viewer/releases for available versions.
# Updated automatically by playbooks/update-versions/perform-updates.yml.
beads_viewer_version: "v0.26.0"

# Maps Ansible architecture facts to the Go release filename fragment used by
# bv (Dicklesworthstone/beads_viewer), which follows the
# {x86_64: amd64, aarch64: arm64} archive naming convention.
beads_viewer_platform_map:
  x86_64: amd64
  aarch64: arm64

# SHA-256 checksums for the linux release archives (amd64 and arm64).
# Compute (download to file first -- pipe-only sha256sum can truncate and
# give the wrong hash):
#   curl -sL https://github.com/Dicklesworthstone/beads_viewer/releases/download/<tag>/bv_<version>_linux_<arch>.tar.gz -o /tmp/bv.tar.gz
#   sha256sum /tmp/bv.tar.gz
beads_viewer_sha256_amd64: "e9f52cda29bb074b166e7c89a3af075fa506e29734085bc4b55348b8a4aab4f1"
beads_viewer_sha256_arm64: "1fa1c8234a4db6ad6c930ef8bfd8819784041ddb206c232d3103bd2f2a3f8a3f"
