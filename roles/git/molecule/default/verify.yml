---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: apt

    - name: Assert git package is installed
      ansible.builtin.assert:
        that:
          - "'git' in ansible_facts.packages"

    - name: Stat the git binary
      ansible.builtin.stat:
        path: /usr/bin/git
      register: git_binary

    - name: Assert git binary exists
      ansible.builtin.assert:
        that:
          - git_binary.stat.exists

    - name: Run git --version
      ansible.builtin.command: git --version
      changed_when: false
      register: git_version_output

    - name: Assert git --version succeeded
      ansible.builtin.assert:
        that:
          - git_version_output.rc == 0
