---
- name: Prepare container
  hosts: all
  gather_facts: false
  become: true
  tasks:
    # A stale opencode at /usr/local/bin/opencode makes converge exercise the
    # upgrade path: the role must replace it, not skip the install because the
    # file exists.
    - name: Plant a stale opencode that reports an older version
      ansible.builtin.copy:
        content: |
          #!/bin/sh
          echo "0.0.1"
        dest: /usr/local/bin/opencode
        owner: root
        group: root
        mode: '0755'
