---
- name: Prepare container
  hosts: all
  gather_facts: false
  become: true
  tasks:
    - name: Create testuser
      ansible.builtin.user:
        name: testuser
        state: present
        create_home: true

    - name: Create Documents/Cline directory for testuser
      ansible.builtin.file:
        path: /home/testuser/Documents/Cline
        state: directory
        owner: testuser
        group: testuser
        mode: '0755'

    # A stale bd at /usr/local/bin/bd makes converge exercise the upgrade
    # path: the role must replace it, not skip the install because the file exists.
    - name: Plant a stale bd that reports an older version
      ansible.builtin.copy:
        content: |
          #!/bin/sh
          echo "bd version 0.0.1 (stale)"
        dest: /usr/local/bin/bd
        owner: root
        group: root
        mode: '0755'
