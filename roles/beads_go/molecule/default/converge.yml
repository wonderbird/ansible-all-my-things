---
- name: Converge
  hosts: all
  become: true
  vars:
    login_user_names:
      - testuser
  roles:
    # git provisions the git binary, a hard runtime dependency of beads_go's
    # source-clone task. Listed explicitly for auditable ordering; also
    # declared in beads_go/meta/main.yml (Ansible deduplicates the second
    # apply).
    - role: git
    - role: beads_go
