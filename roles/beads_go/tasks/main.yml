---
# -----
# Install beads issue tracker (bd) from the gastownhall/beads GitHub release
#
# beads_go_version and the per-architecture checksums are static pins (see
# roles/beads_go/defaults/main.yml), refreshed only by
# playbooks/update-versions/perform-updates.yml -- there is no live
# checksums.txt fetch left; get_url's checksum: param verifies against the
# pinned literal and fails atomically (no partial file left) on mismatch.
# System-wide install rather than per-user: bd is a static per-architecture
# binary with no per-user state (issue/config data lives in ~/.beads or
# project dirs regardless of binary location). The install is gated on
# `bd --version` matching the pin, not on the file existing: a pin bump then
# upgrades an existing host, and a re-run at the pinned version skips the
# redundant re-download/re-extract of the same archive.
# -----

- name: Assert login_user_names is provided
  ansible.builtin.assert:
    that:
      - login_user_names is defined
      - login_user_names | length > 0
    fail_msg: >-
      Variable validation failed: login_user_names must be defined and
      contain at least one username. It is derived from login_users as
      `login_users | map(attribute='name') | list`; a Molecule converge
      play sets it directly in its `vars:` block.

- name: Check if bd binary already exists
  ansible.builtin.stat:
    path: /usr/local/bin/bd
  register: bd_stat

- name: Get installed bd version
  ansible.builtin.command:
    cmd: /usr/local/bin/bd --version
  when: bd_stat.stat.exists
  register: _bd_installed_version
  changed_when: false

# An unreadable version would make the gate below reinstall on every run,
# so it stops the play instead (Constitution Principle XII).
- name: Assert installed bd reports a parseable version
  ansible.builtin.assert:
    that:
      - _bd_installed_version.stdout is match('^bd version [0-9]+\.[0-9]+\.[0-9]+( |$)')
    fail_msg: >-
      /usr/local/bin/bd --version printed '{{ _bd_installed_version.stdout }}',
      which does not start with "bd version <semver>"; cannot tell whether the
      installed version matches beads_go_version {{ beads_go_version }}. Remove
      /usr/local/bin/bd to let the role reinstall.
    quiet: true
  when: bd_stat.stat.exists

# Install unless bd exists and reports exactly the pinned version, so a
# pin bump upgrades an existing host. The version is compared as a whole
# token, so a pin never matches a longer version that merely starts with it.
- name: Determine if bd installation is required
  ansible.builtin.set_fact:
    _bd_needs_install: >-
      {{ not (bd_stat.stat.exists
              and _bd_installed_version.stdout
                  is match('^bd version ' ~ (beads_go_version | regex_replace('^v', '') | regex_escape) ~ '( |$)')) }}

- name: Install bd from a checksum-verified release archive
  when: _bd_needs_install | bool
  become: true
  block:
    - name: Verify supported processor architecture for bd
      ansible.builtin.assert:
        that: "ansible_facts['architecture'] in beads_go_platform_map"
        fail_msg: >
          Unsupported processor architecture: {{ ansible_facts['architecture'] }}.
          Supported architectures are: {{ beads_go_platform_map.keys() | list }}.

    # beads_go_version is a static pin (roles/beads_go/defaults/main.yml),
    # refreshed only by playbooks/update-versions/perform-updates.yml -- see
    # Constitution Principle II. The stripped filename-variant is still
    # derived in-role from the single pinned raw tag.
    - name: Derive stripped bd version from pinned tag
      ansible.builtin.set_fact:
        bd_version: "{{ beads_go_version | regex_replace('^v', '') }}"

    - name: Download and checksum-verify bd archive
      ansible.builtin.get_url:
        url: https://github.com/gastownhall/beads/releases/download/{{ beads_go_version }}/beads_{{ bd_version }}_linux_{{ beads_go_platform_map[ansible_facts['architecture']] }}.tar.gz
        dest: /tmp/beads_{{ bd_version }}_linux_{{ beads_go_platform_map[ansible_facts['architecture']] }}.tar.gz
        checksum: "sha256:{{ (beads_go_sha256_amd64 if ansible_facts['architecture'] == 'x86_64' else beads_go_sha256_arm64) }}"
        mode: '0644'

    - name: Extract bd binary to /usr/local/bin
      ansible.builtin.unarchive:
        src: /tmp/beads_{{ bd_version }}_linux_{{ beads_go_platform_map[ansible_facts['architecture']] }}.tar.gz
        dest: /usr/local/bin
        remote_src: true
        mode: '0755'
        include:
          - bd

- name: Clone beads source repository
  ansible.builtin.git:
    repo: https://github.com/gastownhall/beads.git
    dest: /home/{{ item }}/Documents/Cline/beads
    version: main
    update: yes
    force: no
  become: true
  become_user: "{{ item }}"
  loop: "{{ login_user_names }}"
