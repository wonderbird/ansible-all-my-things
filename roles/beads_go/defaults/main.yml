---
# Pinned bd (gastownhall/beads) release tag (v-prefixed). See
# https://github.com/gastownhall/beads/releases for available versions.
# Updated automatically by playbooks/update-versions/perform-updates.yml.
beads_go_version: "v1.2.2"

# Maps Ansible architecture facts to the Go release filename fragment used by
# bd (gastownhall/beads), which follows the {x86_64: amd64, aarch64: arm64}
# archive naming convention.
beads_go_platform_map:
  x86_64: amd64
  aarch64: arm64

# SHA-256 checksums for the linux release archives (amd64 and arm64).
# Compute (download to file first -- pipe-only sha256sum can truncate and
# give the wrong hash):
#   curl -sL https://github.com/gastownhall/beads/releases/download/<tag>/beads_<ver>_linux_<arch>.tar.gz -o /tmp/bd.tar.gz
#   sha256sum /tmp/bd.tar.gz
beads_go_sha256_amd64: "8140098a51d3b81d5548d1c5e6db1a2d9930e5d141efe2a4bff7d079c4d321e8"
beads_go_sha256_arm64: "501f38a1070d4b9b3b6261a86a3c92c4a52366869021560430a4bb0036afd83a"
