---
- name: Ensure ~/.claude directory exists
  ansible.builtin.file:
    path: /home/{{ item }}/.claude
    state: directory
    owner: "{{ item }}"
    group: "{{ item }}"
    mode: '0755'
  become: true
  loop: "{{ desktop_user_names }}"

# Only the auto-update-disable keys live here: they protect this role's own
# version-pin contract (see DESIGN.md), so they are general and safe for any
# project. Every other settings.json key is opinionated tool configuration
# and belongs to claude_code_config -- see that role's configure.yml, which
# layers its own keys onto the same file after this role has run.
- name: Merge auto-update-disable keys into settings.json
  ansible.builtin.shell: |
    FILE="$HOME/.claude/settings.json"
    if [ -f "$FILE" ]; then
      CURRENT=$(cat "$FILE")
    else
      CURRENT='{}'
    fi
    MERGED=$(printf '%s' "$CURRENT" | jq '
      .env = (.env // {} | . + {"DISABLE_AUTOUPDATER":"1","DISABLE_UPDATES":"1"})
    ')
    CURRENT_NORMALIZED=$(printf '%s' "$CURRENT" | jq '.')
    if [ "$MERGED" = "$CURRENT_NORMALIZED" ]; then
      echo NO_CHANGE
    else
      printf '%s\n' "$MERGED" > "${FILE}.tmp"
      mv "${FILE}.tmp" "$FILE"
      echo CHANGED
    fi
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ item }}"
  loop: "{{ desktop_user_names }}"
  register: claude_code_settings_merge
  changed_when: "'CHANGED' in claude_code_settings_merge.stdout"
