---
# Only ansible platforms listed in claude_code_platform_map are supported.
- name: "Verify supported processor architecture"
  ansible.builtin.assert:
    that: "ansible_facts['architecture'] in claude_code_platform_map"
    fail_msg: >
     Unsupported processor architecture: {{ ansible_facts['architecture'] }}.
     Supported architectures are: {{ claude_code_platform_map.keys() | list }}.

# claude_code_version + per-platform checksums are static pins
# (roles/claude_code/defaults/main.yml), refreshed only by
# playbooks/update-versions/perform-updates.yml -- see Constitution
# Principle II. This converges claude_code's idempotency model onto the same
# stat-gate-before-download shape used by rtk/beads/nodejs (verify-before-
# placement instead of always-reinstall + reverify-after-the-fact).
- name: Select expected checksum for this architecture
  ansible.builtin.set_fact:
    claude_code_expected_checksum: >-
      {{ claude_code_sha256_linux_x64 if ansible_facts['architecture'] == 'x86_64'
         else claude_code_sha256_linux_arm64 }}

# -----
# Install Claude Code for each desktop user
# -----

- name: Check if Claude Code binary already exists for each user
  ansible.builtin.stat:
    path: /home/{{ item }}/.local/bin/claude
  loop: "{{ login_user_names }}"
  register: claude_code_pre_install_stat

- name: Ensure each user's ~/.local/bin exists
  ansible.builtin.file:
    path: /home/{{ item }}/.local/bin
    state: directory
    owner: "{{ item }}"
    mode: '0755'
  become: true
  loop: "{{ login_user_names }}"
  when: not (claude_code_pre_install_stat.results | selectattr('item', 'equalto', item) | first).stat.exists

# The direct binary URL mirrors the pattern claude.ai/install.sh itself uses
# (confirmed against a live fetch): <base>/<version>/<platform>/claude. This
# lets get_url verify the checksum BEFORE placement instead of installing
# unconditionally and reverifying the installed binary after the fact.
- name: Download and checksum-verify the Claude Code binary
  ansible.builtin.get_url:
    url: "{{ claude_code_manifest_base_url }}/{{ claude_code_version }}/{{ claude_code_platform_map[ansible_facts['architecture']] }}/claude"
    dest: /home/{{ item }}/.local/bin/claude
    checksum: "sha256:{{ claude_code_expected_checksum }}"
    owner: "{{ item }}"
    mode: '0755'
  become: true
  loop: "{{ login_user_names }}"
  when: not (claude_code_pre_install_stat.results | selectattr('item', 'equalto', item) | first).stat.exists

# -----
# Ensure Claude Code is in PATH for each desktop user
# -----

- name: Add claude to PATH in .bashrc
  ansible.builtin.blockinfile:
    path: /home/{{ item }}/.bashrc
    block: "export PATH=\"$HOME/.local/bin:$PATH\""
    marker: "# {mark} ANSIBLE MANAGED BLOCK - Claude Code PATH"
    state: present
  become: true
  become_user: "{{ item }}"
  loop: "{{ login_user_names }}"
