---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Check Claude Code binary exists
      ansible.builtin.stat:
        path: /home/testuser/.local/bin/claude
      register: claude_binary_stat

    - name: Assert Claude Code binary is present
      ansible.builtin.assert:
        that:
          - claude_binary_stat.stat.exists
        fail_msg: "Claude Code binary not found at /home/testuser/.local/bin/claude"
        success_msg: "Claude Code binary found at /home/testuser/.local/bin/claude"

    - name: Check claude PATH block is configured in testuser's .bashrc
      ansible.builtin.shell: grep -q 'export PATH="\$HOME/.local/bin:\$PATH"' /home/testuser/.bashrc
      changed_when: false
      failed_when: false
      register: claude_path_val

    - name: Assert claude PATH block is configured in .bashrc
      ansible.builtin.assert:
        that:
          - claude_path_val.rc == 0
        fail_msg: "Claude Code PATH block not found in testuser's .bashrc"
        success_msg: "Claude Code PATH block is configured in testuser's .bashrc"

    - name: Check jq is installed
      ansible.builtin.stat:
        path: /usr/bin/jq
      register: jq_stat

    - name: Assert jq is installed
      ansible.builtin.assert:
        that:
          - jq_stat.stat.exists
        fail_msg: "jq not found at /usr/bin/jq"
        success_msg: "jq found at /usr/bin/jq"

    - name: Read settings.json
      ansible.builtin.slurp:
        src: /home/testuser/.claude/settings.json
      register: settings_file

    - name: Assert settings.json contains the auto-update-disable keys
      ansible.builtin.assert:
        that:
          - settings.env.DISABLE_AUTOUPDATER == "1"
          - settings.env.DISABLE_UPDATES == "1"
        fail_msg: "settings.json is missing the auto-update-disable keys (env.DISABLE_AUTOUPDATER, env.DISABLE_UPDATES)"
        success_msg: "settings.json contains the auto-update-disable keys"
      vars:
        settings: "{{ settings_file.content | b64decode | from_json }}"
