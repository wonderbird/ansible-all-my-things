---
- name: Verify
  hosts: all
  become: true
  tasks:
    - name: Check Claude Code binary exists
      ansible.builtin.stat:
        path: /home/testuser/.local/bin/claude
      register: claude_binary_stat

    - name: Assert Claude Code binary is present
      ansible.builtin.assert:
        that:
          - claude_binary_stat.stat.exists
        fail_msg: "Claude Code binary not found at /home/testuser/.local/bin/claude"
        success_msg: "Claude Code binary found at /home/testuser/.local/bin/claude"

    - name: Check claude PATH block is configured in testuser's .bashrc
      ansible.builtin.shell: grep -q 'export PATH="\$HOME/.local/bin:\$PATH"' /home/testuser/.bashrc
      changed_when: false
      failed_when: false
      register: claude_path_val

    - name: Assert claude PATH block is configured in .bashrc
      ansible.builtin.assert:
        that:
          - claude_path_val.rc == 0
        fail_msg: "Claude Code PATH block not found in testuser's .bashrc"
        success_msg: "Claude Code PATH block is configured in testuser's .bashrc"

    - name: Check jq is installed
      ansible.builtin.stat:
        path: /usr/bin/jq
      register: jq_stat

    - name: Assert jq is installed
      ansible.builtin.assert:
        that:
          - jq_stat.stat.exists
        fail_msg: "jq not found at /usr/bin/jq"
        success_msg: "jq found at /usr/bin/jq"

    - name: Read settings.json
      ansible.builtin.slurp:
        src: /home/testuser/.claude/settings.json
      register: settings_file

    - name: Assert settings.json contains only the auto-update-disable keys
      ansible.builtin.assert:
        that:
          - settings.env.DISABLE_AUTOUPDATER == "1"
          - settings.env.DISABLE_UPDATES == "1"
          - "'CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS' not in (settings.env | default({}))"
          - "'CLAUDE_CODE_SPAWN_BACKEND' not in (settings.env | default({}))"
          - "'teammateMode' not in settings"
          - "'hooks' not in settings"
        fail_msg: "settings.json missing the auto-update-disable keys, or contains opinionated claude_code_config keys"
        success_msg: "settings.json contains only the general auto-update-disable keys"
      vars:
        settings: "{{ settings_file.content | b64decode | from_json }}"

    - name: Check Oh My Claude Code plugin cache directory does not exist
      ansible.builtin.stat:
        path: /home/testuser/.claude/plugins/cache/omc/oh-my-claudecode
      register: omc_cache_stat

    - name: Assert no plugins are installed
      ansible.builtin.assert:
        that:
          - not omc_cache_stat.stat.exists
        fail_msg: "Oh My Claude Code plugin cache found; claude_code alone must not install plugins"
        success_msg: "No plugin cache present, confirming claude_code does not install plugins"

    - name: Check ~/.claude/skills does not exist
      ansible.builtin.stat:
        path: /home/testuser/.claude/skills
      register: skills_dir_stat

    - name: Assert no skills are symlinked
      ansible.builtin.assert:
        that:
          - not skills_dir_stat.stat.exists
        fail_msg: "~/.claude/skills found; claude_code alone must not symlink skills"
        success_msg: "No skills directory present, confirming claude_code does not symlink skills"

    - name: Check registered MCP servers
      ansible.builtin.shell: /home/testuser/.local/bin/claude mcp list
      become: true
      become_user: testuser
      changed_when: false
      register: claude_code_mcp_list_result

    - name: Assert no MCP servers are configured
      ansible.builtin.assert:
        that:
          - "'context7' not in claude_code_mcp_list_result.stdout"
          - "'exa' not in claude_code_mcp_list_result.stdout"
        fail_msg: "MCP server found in 'claude mcp list' output; claude_code alone must not configure MCP servers"
        success_msg: "No MCP servers configured, confirming claude_code does not touch MCP"
