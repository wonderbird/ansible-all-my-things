---
- name: Assert login_user_names is provided
  ansible.builtin.assert:
    that:
      - login_user_names is defined
      - login_user_names | length > 0
    fail_msg: >-
      Variable validation failed: login_user_names must be defined and
      contain at least one username. It is derived from login_users as
      `login_users | map(attribute='name') | list`; a Molecule converge
      play sets it directly in its `vars:` block.

- name: Install sdkman prerequisites
  ansible.builtin.apt:
    name:
      - zip
      - unzip
      - curl
    state: present
    update_cache: true

- name: Download sdkman installer
  ansible.builtin.get_url:
    url: "https://get.sdkman.io"
    dest: "/tmp/sdkman-install.sh"
    mode: "0755"
    force: false

- name: Install sdkman per user
  ansible.builtin.shell:
    cmd: bash /tmp/sdkman-install.sh
    creates: "/home/{{ item }}/.sdkman/bin/sdkman-init.sh"
  environment:
    SDKMAN_DIR: "/home/{{ item }}/.sdkman"
  become_user: "{{ item }}"
  loop: "{{ login_user_names }}"

- name: Install Temurin JDK per user
  ansible.builtin.shell:
    cmd: >
      bash -c 'source /home/{{ item }}/.sdkman/bin/sdkman-init.sh &&
      sdk install java {{ java_sdkman_identifier }}'
    creates: "/home/{{ item }}/.sdkman/candidates/java/{{ java_sdkman_identifier }}/bin/java"
  become_user: "{{ item }}"
  loop: "{{ login_user_names }}"
