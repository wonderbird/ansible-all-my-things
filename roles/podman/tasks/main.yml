---
- name: Assert login_user_names is provided
  ansible.builtin.assert:
    that:
      - login_user_names is defined
      - login_user_names | length > 0
    fail_msg: >-
      Variable validation failed: login_user_names must be defined and
      contain at least one username. It is derived from login_users as
      `login_users | map(attribute='name') | list`; a Molecule converge
      play sets it directly in its `vars:` block.

- name: Install Podman
  ansible.builtin.apt:
    name: podman
    state: present
    update_cache: true

- name: Configure subuid for each desktop user
  ansible.builtin.lineinfile:
    path: /etc/subuid
    regexp: "^{{ item }}:"
    line: "{{ item }}:{{ podman_subuid_start }}:{{ podman_subuid_count }}"
  loop: "{{ login_user_names }}"

- name: Configure subgid for each desktop user
  ansible.builtin.lineinfile:
    path: /etc/subgid
    regexp: "^{{ item }}:"
    line: "{{ item }}:{{ podman_subgid_start }}:{{ podman_subgid_count }}"
  loop: "{{ login_user_names }}"

- name: Run podman system migrate for each desktop user
  ansible.builtin.command: podman system migrate
  become_user: "{{ item }}"
  loop: "{{ login_user_names }}"
  when: podman_run_migrate
  changed_when: false
