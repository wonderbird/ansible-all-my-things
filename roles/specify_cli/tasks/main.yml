---
- name: Assert login_user_names is provided
  ansible.builtin.assert:
    that:
      - login_user_names is defined
      - login_user_names | length > 0
    fail_msg: >-
      Variable validation failed: login_user_names must be defined and
      contain at least one username. It is derived from login_users as
      `login_users | map(attribute='name') | list`; a Molecule converge
      play sets it directly in its `vars:` block.

- name: Install pipx
  ansible.builtin.apt:
    name: pipx
    state: present
  become: true

- name: Install specify-cli via pipx
  ansible.builtin.shell:
    cmd: "pipx install git+https://github.com/github/spec-kit.git@{{ specify_cli_version }}"
    creates: /home/{{ item }}/.local/bin/specify
  become: true
  become_user: "{{ item }}"
  environment:
    PATH: "/home/{{ item }}/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
  loop: "{{ login_user_names }}"
