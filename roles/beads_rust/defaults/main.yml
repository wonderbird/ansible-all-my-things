---
# Pinned br (Dicklesworthstone/beads_rust) release tag (v-prefixed). See
# https://github.com/Dicklesworthstone/beads_rust/releases for available versions.
# Updated automatically by playbooks/update-versions/perform-updates.yml.
beads_rust_version: "v0.3.2"

# Maps Ansible architecture facts to the Rust release filename fragment used by
# br (Dicklesworthstone/beads_rust), which follows the
# {x86_64: amd64, aarch64: arm64} archive naming convention.
beads_rust_platform_map:
  x86_64: amd64
  aarch64: arm64

# SHA-256 checksums for the linux release archives (amd64 and arm64).
# Compute (download to file first -- pipe-only sha256sum can truncate and
# give the wrong hash):
#   curl -sL https://github.com/Dicklesworthstone/beads_rust/releases/download/<tag>/br-<stripped_ver>-linux_<arch>.tar.gz -o /tmp/br.tar.gz
#   sha256sum /tmp/br.tar.gz
# Cross-check against the release's per-archive "<filename>.sha256" sidecar
# file (not a combined checksums file -- upstream has renamed that across
# releases: checksums.sha256, then SHA256SUMS/SHA256SUMS.txt).
beads_rust_sha256_amd64: "e67c560e77e912490e44a65e3e9c13205210d171e729c5d801072ee508207288"
beads_rust_sha256_arm64: "55e6060f5ea2367629afc5413bbe262b011c5cf3f234fcfd66d70d437d77edb6"
