---
# -----
# Install beads Rust issue tracker (br) from the Dicklesworthstone/beads_rust
# GitHub release
#
# beads_rust_version and the per-architecture checksums are static pins (see
# roles/beads_rust/defaults/main.yml), refreshed only by
# playbooks/update-versions/perform-updates.yml -- there is no live
# checksums.sha256 fetch left; get_url's checksum: param verifies against the
# pinned literal and fails atomically (no partial file left) on mismatch.
# System-wide install rather than per-user: br is a static per-architecture
# binary with no per-user state (issue/config data lives in ~/.beads or
# project dirs regardless of binary location). The install is gated on
# `br --version` matching the pin (roles/binary_version_gate), so a re-run at
# the pinned version skips the redundant re-download/re-extract.
# -----

- name: Assert login_user_names is provided
  ansible.builtin.assert:
    that:
      - login_user_names is defined
      - login_user_names | length > 0
    fail_msg: >-
      Variable validation failed: login_user_names must be defined and
      contain at least one username. It is derived from login_users as
      `login_users | map(attribute='name') | list`; a Molecule converge
      play sets it directly in its `vars:` block.

- name: Check whether the installed br reports the pinned version
  ansible.builtin.include_role:
    name: binary_version_gate
  vars:
    binary_version_gate_path: /usr/local/bin/br
    binary_version_gate_output_prefix: "br "
    binary_version_gate_pin: "{{ beads_rust_version }}"
    binary_version_gate_result_var: _beads_rust_is_current

- name: Install br from a checksum-verified release archive
  when: not _beads_rust_is_current | bool
  become: true
  block:
    - name: Verify supported processor architecture for br
      ansible.builtin.assert:
        that: "ansible_facts['architecture'] in beads_rust_platform_map"
        fail_msg: >
          Unsupported processor architecture: {{ ansible_facts['architecture'] }}.
          Supported architectures are: {{ beads_rust_platform_map.keys() | list }}.

    # beads_rust_version is a static pin (roles/beads_rust/defaults/main.yml),
    # refreshed only by playbooks/update-versions/perform-updates.yml -- see
    # Constitution Principle II. The stripped filename-variant is still
    # derived in-role from the single pinned raw tag.
    - name: Derive stripped br version from pinned tag
      ansible.builtin.set_fact:
        br_version: "{{ beads_rust_version | regex_replace('^v', '') }}"

    - name: Download and checksum-verify br archive
      ansible.builtin.get_url:
        url: https://github.com/Dicklesworthstone/beads_rust/releases/download/{{ beads_rust_version }}/br-{{ br_version }}-linux_{{ beads_rust_platform_map[ansible_facts['architecture']] }}.tar.gz
        dest: /tmp/br-{{ br_version }}-linux_{{ beads_rust_platform_map[ansible_facts['architecture']] }}.tar.gz
        checksum: "sha256:{{ (beads_rust_sha256_amd64 if ansible_facts['architecture'] == 'x86_64' else beads_rust_sha256_arm64) }}"
        mode: '0644'

    - name: Extract br binary to /usr/local/bin
      ansible.builtin.unarchive:
        src: /tmp/br-{{ br_version }}-linux_{{ beads_rust_platform_map[ansible_facts['architecture']] }}.tar.gz
        dest: /usr/local/bin
        remote_src: true
        mode: '0755'
        include:
          - br

- name: Clone beads_rust source repository
  ansible.builtin.git:
    repo: https://github.com/Dicklesworthstone/beads_rust.git
    dest: /home/{{ item }}/Documents/Cline/beads_rust
    version: main
    update: yes
    force: no
  become: true
  become_user: "{{ item }}"
  loop: "{{ login_user_names }}"
