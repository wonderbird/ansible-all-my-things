---
- name: Validate required variables
  ansible.builtin.assert:
    that:
      - uv_version is match('^[0-9]+\.[0-9]+\.[0-9]+$')
      - uv_sha256_x86_64_gnu is match('^[0-9a-f]{64}$')
      - uv_sha256_aarch64_gnu is match('^[0-9a-f]{64}$')
    fail_msg: >-
      Variable validation failed: uv_version must be a bare semver release tag
      without a `v` prefix (e.g. 0.13.5), got '{{ uv_version }}';
      uv_sha256_x86_64_gnu and uv_sha256_aarch64_gnu must each be a
      64-character lowercase SHA-256 hex digest.

- name: Verify supported processor architecture
  ansible.builtin.assert:
    that:
      - ansible_facts['architecture'] in uv_platform_map
    fail_msg: >-
      Unsupported processor architecture: {{ ansible_facts['architecture'] }}.
      Supported architectures are: {{ uv_platform_map.keys() | list }}.

- name: Set uv release archive facts
  ansible.builtin.set_fact:
    _uv_triple: "{{ uv_platform_map[ansible_facts['architecture']] }}"
    _uv_sha256: >-
      {{ {'x86_64': uv_sha256_x86_64_gnu,
          'aarch64': uv_sha256_aarch64_gnu}[ansible_facts['architecture']] }}

- name: Check whether uv and uvx are installed
  ansible.builtin.stat:
    path: "/usr/local/bin/{{ item }}"
  loop: [uv, uvx]
  register: _uv_binary_stat

- name: Get installed uv and uvx versions
  ansible.builtin.command:
    cmd: "{{ item.stat.path }} --version"
  loop: "{{ _uv_binary_stat.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: item.stat.exists
  register: _uv_installed_versions
  changed_when: false

# An unreadable version would make the gate below reinstall on every run,
# so it stops the play instead (Constitution Principle XII).
- name: Assert installed uv and uvx report a parseable version
  ansible.builtin.assert:
    that:
      - item.stdout is match('^uvx? [0-9]+\.[0-9]+\.[0-9]+( |$)')
    fail_msg: >-
      {{ item.cmd | join(' ') }} printed '{{ item.stdout }}', which does not
      start with "uv <semver>" or "uvx <semver>"; cannot tell whether the
      installed version matches uv_version {{ uv_version }}.
    quiet: true
  loop: "{{ _uv_installed_versions.results | selectattr('stdout', 'defined') | list }}"
  loop_control:
    label: "{{ item.item.item }}"

# Install unless both binaries exist and both report exactly the pinned
# version, so a pin bump upgrades an existing host and a lost uvx is repaired.
# A missing binary has no version output, so it is never counted as current.
- name: Determine if uv installation is required
  ansible.builtin.set_fact:
    _uv_needs_install: >-
      {{ _uv_installed_versions.results
         | selectattr('stdout', 'defined')
         | map(attribute='stdout')
         | select('match', '^uvx? ' ~ (uv_version | regex_escape) ~ '( |$)')
         | list | length < 2 }}

- name: Install uv and uvx from the checksum-verified release archive
  when: _uv_needs_install | bool
  block:
    # A fresh root-owned 0700 directory with a random name: a fixed path in
    # world-writable /tmp could be pre-created by another user, who could then
    # swap the binaries before they are copied into /usr/local/bin.
    - name: Create a private staging directory for the uv archive
      ansible.builtin.tempfile:
        state: directory
        prefix: uv-
      register: _uv_staging

    - name: Download the uv release archive
      ansible.builtin.get_url:
        url: "https://github.com/astral-sh/uv/releases/download/{{ uv_version }}/uv-{{ _uv_triple }}.tar.gz"
        dest: "{{ _uv_staging.path }}/uv-{{ _uv_triple }}.tar.gz"
        checksum: "sha256:{{ _uv_sha256 }}"
        mode: '0644'

    - name: Extract the uv release archive
      ansible.builtin.unarchive:
        src: "{{ _uv_staging.path }}/uv-{{ _uv_triple }}.tar.gz"
        dest: "{{ _uv_staging.path }}"
        remote_src: true

    # Copied rather than extracted in place: the archive records a non-root
    # owner, and system binaries must be owned by root.
    - name: Install uv and uvx to /usr/local/bin
      ansible.builtin.copy:
        src: "{{ _uv_staging.path }}/uv-{{ _uv_triple }}/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        remote_src: true
        owner: root
        group: root
        mode: '0755'
      loop: [uv, uvx]

  always:
    # Skipped only when the staging directory itself could not be created;
    # that failure has already stopped the play.
    - name: Remove the uv staging directory
      ansible.builtin.file:
        path: "{{ _uv_staging.path }}"
        state: absent
      when: _uv_staging.path is defined
