---
# Pinned uv release tag. Upstream tags are bare semver, without a `v` prefix.
# See https://github.com/astral-sh/uv/releases for available versions.
# Updated automatically by playbooks/update-versions/perform-updates.yml.
uv_version: "0.13.6"

# Maps an Ansible architecture fact to the upstream target triple that names
# the release archive (uv-<triple>.tar.gz) and the directory inside it.
uv_platform_map:
  x86_64: "x86_64-unknown-linux-gnu"
  aarch64: "aarch64-unknown-linux-gnu"

# SHA-256 checksum of each supported release archive, as published by
# upstream in each archive's <archive>.sha256 sidecar.
# The version and every checksum must be updated together.
#
# Updated automatically by playbooks/update-versions/perform-updates.yml.
uv_sha256_x86_64_gnu: "f29c3e94ffabd7e6f3ba521dba169a9b7ec12100bf3257087f0f24f6123f3645"
uv_sha256_aarch64_gnu: "229e194255c7958d86d56e8790d969a6f74736592133f0dfd0076f754c642c1d"
