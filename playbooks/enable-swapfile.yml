---
- name: Enable a swap file on an existing Linux VM
  hosts: localhost
  gather_facts: false
  vars:
    assert_provider_usage_hint: >-
      Run: ansible-playbook playbooks/enable-swapfile.yml -e provider=<tart|hcloud|aws>
      -e hostname=<name> -e swap_size_gb=<GB>
    autogenerated_inventory_file: "{{ playbook_dir }}/../inventories/{{ provider }}_autogenerated.yml"
  pre_tasks:
    - name: Assert provider, hostname and swap_size_gb are given
      ansible.builtin.assert:
        that:
          - provider is defined
          - hostname is defined and hostname | length > 0
          - swap_size_gb is defined
        fail_msg: >-
          provider, hostname and swap_size_gb are required.
          {{ assert_provider_usage_hint }}

    - name: Assert provider and swap file size are supported
      ansible.builtin.import_tasks: tasks/assert-provider-profile.yml
  tasks:
    - name: Add the VM to the swapfile group
      ansible.builtin.include_tasks: tasks/inventory/enable-swapfile.yml
