---
# TEMPORARY, deleted with the apply-phase rewrite.
#
# The hand-written fetch blocks copied the shared fetch output into a per-tool
# fact, and the apply phase still reads those names. While the fetch phase runs
# from the registry and the apply phase does not, fetch-tool.yml republishes
# each tool's own result under its old name. The value always comes from that
# tool's own fetch.results, so the bridge cannot carry another tool's value.
#
# Tools absent from this map need no bridge: their fetch task file sets the
# names the apply phase reads.
_legacy_fetch_facts:
  tmux: {fetched_gitmux_tag: version}
  nerd_font: {fetched_font_tag: version}
  dolt_sql_server: {fetched_dolt_tag: version}
  opencode: {fetched_opencode_tag: version}
  github_cli: {fetched_github_cli_tag: version}
  rtk: {fetched_rtk_tag: version}
  beads_go: {fetched_beads_go_tag: version}
  beads_viewer: {fetched_beads_viewer_tag: version}
  beads_rust: {fetched_beads_rust_tag: version}
  specify_cli: {fetched_specify_cli_tag: version}
  skill_manager: {fetched_skill_manager_sha: version}
  direnv: {fetched_direnv_tag: version}
