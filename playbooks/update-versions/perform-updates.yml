---
# One tool's upstream outage must not hide every later tool, so each tool runs
# inside a fetch block and an apply block with a rescue. Third-party failures
# accumulate in _update_failures and the run reports all of them at the end; a
# configuration error stops the run at once. Which failures count as which is
# decided in tasks/record-tool-failure.yml.
#
# Every block guard reads only the facts initialised below and uses no attribute
# access that can be undefined: a templating error inside a block's own `when:`
# is NOT caught by that block's rescue -- the rescue tasks inherit the same
# `when:`, fail again, and the play aborts past its own error handling.
- name: Update pinned versions in role defaults files
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars/tools.yml
  vars:
    _roles_dir: "{{ playbook_dir }}/../../roles"
    _registry_file: "{{ playbook_dir }}/vars/tools.yml"
    _registry_roles_dir: "{{ _roles_dir }}"
  tasks:
    - name: Check the preconditions of this run
      ansible.builtin.include_tasks: tasks/preflight.yml

    - name: Initialise the run ledgers
      ansible.builtin.set_fact:
        _update_failures: []
        _update_updated: []
        _update_skipped: []
        _fetch_results: {}

    # --- Fetch upstream versions ---
    - name: Read the pins the roles carry today
      ansible.builtin.include_tasks: tasks/read-current-pins.yml

    - name: Fetch the upstream data of every tool
      ansible.builtin.include_tasks: tasks/fetch-tool.yml
      # names only: a loop over whole registry entries templates every
      # expression of every entry before the first task runs, outside any block
      loop: "{{ _tools.keys() | list }}"
      loop_control:
        loop_var: _name
        label: "{{ _name }}"

    # --- Apply updates to role defaults files ---
    - name: Record the tools whose fetch failed as skipped
      ansible.builtin.set_fact:
        _update_skipped: "{{ _update_failures | selectattr('phase', 'equalto', 'fetch') | map(attribute='tool') | list }}"

    - name: Write the pins of every tool whose fetch succeeded
      ansible.builtin.include_tasks: tasks/apply-tool.yml
      # The guard templates only the loop variable and the failure ledger: a
      # templating error in a task's own `when:` is not caught by its block's
      # rescue, so nothing that can be undefined may appear here.
      when: >-
        _name not in (_update_failures
                      | selectattr('phase', 'equalto', 'fetch')
                      | map(attribute='tool') | list)
      loop: "{{ _tools.keys() | list }}"
      loop_control:
        loop_var: _name
        label: "{{ _name }}"


    # --- Account for every tool, then report ---
    - name: Assert every tracked tool has exactly one apply outcome
      vars:
        _failed_in_apply: >-
          {{ _update_failures | selectattr('phase', 'equalto', 'apply')
             | map(attribute='tool') | list }}
        _outcomes: "{{ _update_updated + _update_skipped + _failed_in_apply }}"
      ansible.builtin.assert:
        that:
          - _outcomes | length == _tools.keys() | list | length
          - _outcomes | unique | length == _outcomes | length
          - _outcomes | difference(_tools.keys() | list) | length == 0
          - _tools.keys() | list | difference(_outcomes) | length == 0
        fail_msg: >-
          Accounting is inconsistent: updated={{ _update_updated }},
          skipped={{ _update_skipped }}, failed in apply={{ _failed_in_apply }},
          tracked={{ _tools.keys() | list }}.
        quiet: true

    - name: Assert the skipped tools are exactly those whose fetch failed
      vars:
        _failed_in_fetch: >-
          {{ _update_failures | selectattr('phase', 'equalto', 'fetch')
             | map(attribute='tool') | list }}
      ansible.builtin.assert:
        that:
          - _update_skipped | difference(_failed_in_fetch) | length == 0
          - _failed_in_fetch | difference(_update_skipped) | length == 0
        fail_msg: >-
          Skipped tools {{ _update_skipped }} do not match the tools whose fetch
          failed {{ _failed_in_fetch }}; a guard is keyed wrongly, so a healthy
          tool was silently left unwritten or a failed one was written anyway.
        quiet: true

    - name: Report the run
      ansible.builtin.include_tasks: tasks/report-update-failures.yml
      when: _update_failures | length > 0

    - name: Report a clean run
      ansible.builtin.debug:
        msg: >-
          Updated {{ _update_updated | length }} of
          {{ _tools.keys() | list | length }} tools: {{ _update_updated | join(', ') }}
      when: _update_failures | length == 0
