#SPDX-License-Identifier: MIT-0
---
- name: Update pinned versions in role defaults files
  hosts: localhost
  gather_facts: false
  vars:
    _roles_dir: "{{ playbook_dir }}/../../roles"
  tasks:
    # --- Read current Java identifier to derive major version for fetch ---
    - name: Read java role defaults
      ansible.builtin.slurp:
        src: "{{ _roles_dir }}/java/defaults/main.yml"
      register: _java_defaults_raw

    - name: Derive Java major version from current identifier
      vars:
        _java_id_match: >-
          {{ _java_defaults_raw.content | b64decode
             | regex_search('java_sdkman_identifier:\s*"([^"]+)"', '\1')
             | default([], true) }}
      ansible.builtin.set_fact:
        _current_java_major: "{{ (_java_id_match | first).split('.')[0] | int }}"

    # --- Fetch upstream versions ---
    - name: Fetch Flutter upstream version
      ansible.builtin.include_tasks: tasks/fetch-flutter-version.yml

    - name: Fetch gitmux upstream version
      ansible.builtin.include_tasks: tasks/fetch-github-release.yml
      vars:
        github_repo: "arl/gitmux"

    - name: Save gitmux fetched tag
      ansible.builtin.set_fact:
        fetched_gitmux_tag: "{{ fetched_github_tag }}"

    - name: Fetch Nerd Fonts (Hack) upstream version
      ansible.builtin.include_tasks: tasks/fetch-github-release.yml
      vars:
        github_repo: "ryanoasis/nerd-fonts"

    - name: Save Nerd Fonts fetched tag
      ansible.builtin.set_fact:
        fetched_font_tag: "{{ fetched_github_tag }}"

    - name: Fetch Java upstream version for major {{ _current_java_major }}
      ansible.builtin.include_tasks: tasks/fetch-java-version.yml
      vars:
        java_sdkman_major: "{{ _current_java_major }}"

    - name: Fetch Android cmdline-tools upstream version
      ansible.builtin.include_tasks: tasks/fetch-android-version.yml

    - name: Fetch Dolt upstream version
      ansible.builtin.include_tasks: tasks/fetch-github-release.yml
      vars:
        github_repo: "dolthub/dolt"

    - name: Save Dolt fetched tag
      ansible.builtin.set_fact:
        fetched_dolt_tag: "{{ fetched_github_tag }}"

    - name: Fetch OpenCode upstream version
      ansible.builtin.include_tasks: tasks/fetch-github-release.yml
      vars:
        github_repo: "anomalyco/opencode"

    - name: Save OpenCode fetched tag
      ansible.builtin.set_fact:
        fetched_opencode_tag: "{{ fetched_github_tag }}"

    - name: Fetch GitHub CLI upstream version
      ansible.builtin.include_tasks: tasks/fetch-github-release.yml
      vars:
        github_repo: "cli/cli"

    - name: Save GitHub CLI fetched tag
      ansible.builtin.set_fact:
        fetched_github_cli_tag: "{{ fetched_github_tag }}"

    - name: Fetch Obsidian upstream version
      ansible.builtin.include_tasks: tasks/fetch-obsidian-version.yml

    - name: Fetch rtk upstream version
      ansible.builtin.include_tasks: tasks/fetch-github-release.yml
      vars:
        github_repo: "rtk-ai/rtk"

    - name: Save rtk fetched tag
      ansible.builtin.set_fact:
        fetched_rtk_tag: "{{ fetched_github_tag }}"

    - name: Fetch bd upstream version
      ansible.builtin.include_tasks: tasks/fetch-github-release.yml
      vars:
        github_repo: "gastownhall/beads"

    - name: Save bd fetched tag
      ansible.builtin.set_fact:
        fetched_beads_go_tag: "{{ fetched_github_tag }}"

    - name: Fetch bv upstream version
      ansible.builtin.include_tasks: tasks/fetch-github-release.yml
      vars:
        github_repo: "Dicklesworthstone/beads_viewer"

    - name: Save bv fetched tag
      ansible.builtin.set_fact:
        fetched_beads_viewer_tag: "{{ fetched_github_tag }}"

    - name: Fetch br upstream version
      ansible.builtin.include_tasks: tasks/fetch-github-release.yml
      vars:
        github_repo: "Dicklesworthstone/beads_rust"

    - name: Save br fetched tag
      ansible.builtin.set_fact:
        fetched_beads_rust_tag: "{{ fetched_github_tag }}"

    - name: Fetch Node.js upstream LTS version
      ansible.builtin.include_tasks: tasks/fetch-nodejs-version.yml

    - name: Fetch specify-cli upstream version
      ansible.builtin.include_tasks: tasks/fetch-github-release.yml
      vars:
        github_repo: "github/spec-kit"

    - name: Save specify-cli fetched tag
      ansible.builtin.set_fact:
        fetched_specify_cli_tag: "{{ fetched_github_tag }}"

    - name: Fetch Claude Code upstream version and checksums
      ansible.builtin.include_tasks: tasks/fetch-claude-code-version.yml

    - name: Fetch skill-manager upstream commit SHA
      ansible.builtin.include_tasks: tasks/fetch-github-commit-sha.yml
      vars:
        github_repo: "omrikais/skill-manager"
        git_ref: "master"

    - name: Save skill-manager fetched commit SHA
      ansible.builtin.set_fact:
        fetched_skill_manager_sha: "{{ fetched_github_sha }}"

    - name: Fetch direnv upstream version
      ansible.builtin.include_tasks: tasks/fetch-github-release.yml
      vars:
        github_repo: "direnv/direnv"

    - name: Save direnv fetched tag
      ansible.builtin.set_fact:
        fetched_direnv_tag: "{{ fetched_github_tag }}"

    # --- Apply updates to role defaults files ---

    # Flutter SDK: version and sha256 updated together
    - name: Update flutter_version in flutter role defaults
      ansible.builtin.replace:
        path: "{{ _roles_dir }}/flutter/defaults/main.yml"
        regexp: 'flutter_version:\s*"[^"]+"'
        replace: 'flutter_version: "{{ fetched_flutter_version }}"'

    - name: Update flutter_sha256 in flutter role defaults
      ansible.builtin.replace:
        path: "{{ _roles_dir }}/flutter/defaults/main.yml"
        regexp: 'flutter_sha256:\s*"[^"]+"'
        replace: 'flutter_sha256: "{{ fetched_flutter_sha256 }}"'

    # gitmux
    - name: Update tmux_gitmux_version in tmux role defaults
      ansible.builtin.replace:
        path: "{{ _roles_dir }}/tmux/defaults/main.yml"
        regexp: 'tmux_gitmux_version:\s*"[^"]+"'
        replace: 'tmux_gitmux_version: "{{ fetched_gitmux_tag }}"'

    # Nerd Fonts (Hack)
    - name: Update nerd_font_version in nerd_font role defaults
      ansible.builtin.replace:
        path: "{{ _roles_dir }}/nerd_font/defaults/main.yml"
        regexp: 'nerd_font_version:\s*"[^"]+"'
        replace: 'nerd_font_version: "{{ fetched_font_tag }}"'

    # Java (Temurin)
    - name: Update java_sdkman_identifier in java role defaults
      ansible.builtin.replace:
        path: "{{ _roles_dir }}/java/defaults/main.yml"
        regexp: 'java_sdkman_identifier:\s*"[^"]+"'
        replace: 'java_sdkman_identifier: "{{ fetched_java_identifier }}"'

    # Android cmdline-tools: build number and sha1 updated together
    - name: Update android_cmdlinetools_build in android_studio role defaults
      ansible.builtin.replace:
        path: "{{ _roles_dir }}/android_studio/defaults/main.yml"
        regexp: 'android_cmdlinetools_build:\s*"[^"]+"'
        replace: 'android_cmdlinetools_build: "{{ fetched_android_build }}"'

    - name: Update android_cmdlinetools_sha1 in android_studio role defaults
      ansible.builtin.replace:
        path: "{{ _roles_dir }}/android_studio/defaults/main.yml"
        regexp: 'android_cmdlinetools_sha1:\s*"[^"]+"'
        replace: 'android_cmdlinetools_sha1: "{{ fetched_android_sha1 }}"'

    # Dolt
    - name: Download dolt amd64 tarball for sha256 computation
      ansible.builtin.get_url:
        url: "https://github.com/dolthub/dolt/releases/download/{{ fetched_dolt_tag }}/dolt-linux-amd64.tar.gz"
        dest: "/tmp/dolt-{{ fetched_dolt_tag }}-linux-amd64.tar.gz"
        mode: '0644'

    - name: Compute sha256 of dolt amd64 tarball
      ansible.builtin.stat:
        path: "/tmp/dolt-{{ fetched_dolt_tag }}-linux-amd64.tar.gz"
        checksum_algorithm: sha256
        get_checksum: true
      register: _dolt_amd64_stat

    - name: Download dolt arm64 tarball for sha256 computation
      ansible.builtin.get_url:
        url: "https://github.com/dolthub/dolt/releases/download/{{ fetched_dolt_tag }}/dolt-linux-arm64.tar.gz"
        dest: "/tmp/dolt-{{ fetched_dolt_tag }}-linux-arm64.tar.gz"
        mode: '0644'

    - name: Compute sha256 of dolt arm64 tarball
      ansible.builtin.stat:
        path: "/tmp/dolt-{{ fetched_dolt_tag }}-linux-arm64.tar.gz"
        checksum_algorithm: sha256
        get_checksum: true
      register: _dolt_arm64_stat

    - name: Update dolt_version in dolt_sql_server role defaults
      ansible.builtin.replace:
        path: "{{ _roles_dir }}/dolt_sql_server/defaults/main.yml"
        regexp: 'dolt_version:\s*"[^"]+"'
        replace: 'dolt_version: "{{ fetched_dolt_tag }}"'

    - name: Update dolt_sha256_amd64 in dolt_sql_server role defaults
      ansible.builtin.replace:
        path: "{{ _roles_dir }}/dolt_sql_server/defaults/main.yml"
        regexp: 'dolt_sha256_amd64:\s*"[^"]+"'
        replace: 'dolt_sha256_amd64: "{{ _dolt_amd64_stat.stat.checksum }}"'

    - name: Update dolt_sha256_arm64 in dolt_sql_server role defaults
      ansible.builtin.replace:
        path: "{{ _roles_dir }}/dolt_sql_server/defaults/main.yml"
        regexp: 'dolt_sha256_arm64:\s*"[^"]+"'
        replace: 'dolt_sha256_arm64: "{{ _dolt_arm64_stat.stat.checksum }}"'

    - name: Download opencode linux-x64 tarball for sha256 computation
      ansible.builtin.get_url:
        url: "https://github.com/anomalyco/opencode/releases/download/{{ fetched_opencode_tag }}/opencode-linux-x64.tar.gz"
        dest: "/tmp/opencode-{{ fetched_opencode_tag }}-linux-x64.tar.gz"
        mode: '0644'

    - name: Compute sha256 of opencode linux-x64 tarball
      ansible.builtin.stat:
        path: "/tmp/opencode-{{ fetched_opencode_tag }}-linux-x64.tar.gz"
        checksum_algorithm: sha256
        get_checksum: true
      register: _opencode_amd64_stat

    - name: Download opencode linux-arm64 tarball for sha256 computation
      ansible.builtin.get_url:
        url: "https://github.com/anomalyco/opencode/releases/download/{{ fetched_opencode_tag }}/opencode-linux-arm64.tar.gz"
        dest: "/tmp/opencode-{{ fetched_opencode_tag }}-linux-arm64.tar.gz"
        mode: '0644'

    - name: Compute sha256 of opencode linux-arm64 tarball
      ansible.builtin.stat:
        path: "/tmp/opencode-{{ fetched_opencode_tag }}-linux-arm64.tar.gz"
        checksum_algorithm: sha256
        get_checksum: true
      register: _opencode_arm64_stat

    - name: Update opencode_version in opencode role defaults
      ansible.builtin.replace:
        path: "{{ _roles_dir }}/opencode/defaults/main.yml"
        regexp: 'opencode_version:\s*"[^"]+"'
        replace: 'opencode_version: "{{ fetched_opencode_tag }}"'

    - name: Update opencode_sha256_amd64 in opencode role defaults
      ansible.builtin.replace:
        path: "{{ _roles_dir }}/opencode/defaults/main.yml"
        regexp: 'opencode_sha256_amd64:\s*"[^"]+"'
        replace: 'opencode_sha256_amd64: "{{ _opencode_amd64_stat.stat.checksum }}"'

    - name: Update opencode_sha256_arm64 in opencode role defaults
      ansible.builtin.replace:
        path: "{{ _roles_dir }}/opencode/defaults/main.yml"
        regexp: 'opencode_sha256_arm64:\s*"[^"]+"'
        replace: 'opencode_sha256_arm64: "{{ _opencode_arm64_stat.stat.checksum }}"'

    # GitHub CLI
    - name: Update github_cli_version in github_cli role defaults
      ansible.builtin.replace:
        path: "{{ _roles_dir }}/github_cli/defaults/main.yml"
        regexp: 'github_cli_version:\s*"[^"]+"'
        replace: 'github_cli_version: "{{ fetched_github_cli_tag }}"'

    # Obsidian: version and sha256 (amd64-only) updated together
    - name: Download Obsidian amd64 .deb for sha256 computation
      ansible.builtin.get_url:
        url: >-
          https://github.com/obsidianmd/obsidian-releases/releases/download/{{ fetched_obsidian_tag }}/obsidian_{{ fetched_obsidian_tag | regex_replace('^v', '') }}_amd64.deb
        dest: "/tmp/obsidian-{{ fetched_obsidian_tag }}-amd64.deb"
        mode: '0644'

    - name: Compute sha256 of Obsidian amd64 .deb
      ansible.builtin.stat:
        path: "/tmp/obsidian-{{ fetched_obsidian_tag }}-amd64.deb"
        checksum_algorithm: sha256
        get_checksum: true
      register: _obsidian_amd64_stat

    - name: Update obsidian_version in obsidian role defaults
      ansible.builtin.replace:
        path: "{{ _roles_dir }}/obsidian/defaults/main.yml"
        regexp: 'obsidian_version:\s*"[^"]+"'
        replace: 'obsidian_version: "{{ fetched_obsidian_tag }}"'

    - name: Update obsidian_sha256_amd64 in obsidian role defaults
      ansible.builtin.replace:
        path: "{{ _roles_dir }}/obsidian/defaults/main.yml"
        regexp: 'obsidian_sha256_amd64:\s*"[^"]+"'
        replace: 'obsidian_sha256_amd64: "{{ _obsidian_amd64_stat.stat.checksum }}"'

    # rtk: version and both per-triple sha256 checksums updated together
    - name: Fetch rtk x86_64-musl checksum from upstream checksums.txt
      ansible.builtin.include_tasks: tasks/fetch-checksum-from-file.yml
      vars:
        checksum_file_url: "https://github.com/rtk-ai/rtk/releases/download/{{ fetched_rtk_tag }}/checksums.txt"
        checksum_target_filename: "rtk-x86_64-unknown-linux-musl.tar.gz"

    - name: Save rtk x86_64-musl fetched checksum
      ansible.builtin.set_fact:
        fetched_rtk_sha256_x86_64_musl: "{{ fetched_checksum }}"

    - name: Fetch rtk aarch64-gnu checksum from upstream checksums.txt
      ansible.builtin.include_tasks: tasks/fetch-checksum-from-file.yml
      vars:
        checksum_file_url: "https://github.com/rtk-ai/rtk/releases/download/{{ fetched_rtk_tag }}/checksums.txt"
        checksum_target_filename: "rtk-aarch64-unknown-linux-gnu.tar.gz"

    - name: Save rtk aarch64-gnu fetched checksum
      ansible.builtin.set_fact:
        fetched_rtk_sha256_aarch64_gnu: "{{ fetched_checksum }}"

    - name: Update rtk_version in rtk role defaults
      ansible.builtin.replace:
        path: "{{ _roles_dir }}/rtk/defaults/main.yml"
        regexp: 'rtk_version:\s*"[^"]+"'
        replace: 'rtk_version: "{{ fetched_rtk_tag }}"'

    - name: Update rtk_sha256_x86_64_musl in rtk role defaults
      ansible.builtin.replace:
        path: "{{ _roles_dir }}/rtk/defaults/main.yml"
        regexp: 'rtk_sha256_x86_64_musl:\s*"[^"]+"'
        replace: 'rtk_sha256_x86_64_musl: "{{ fetched_rtk_sha256_x86_64_musl }}"'

    - name: Update rtk_sha256_aarch64_gnu in rtk role defaults
      ansible.builtin.replace:
        path: "{{ _roles_dir }}/rtk/defaults/main.yml"
        regexp: 'rtk_sha256_aarch64_gnu:\s*"[^"]+"'
        replace: 'rtk_sha256_aarch64_gnu: "{{ fetched_rtk_sha256_aarch64_gnu }}"'

    # bd: raw tag pinned as source of truth; stripped filename-variant is
    # derived from it in-role (roles/beads_go/tasks/main.yml), not pinned separately
    - name: Derive stripped bd version for filename computation
      ansible.builtin.set_fact:
        _bd_stripped_version: "{{ fetched_beads_go_tag | regex_replace('^v', '') }}"

    - name: Fetch bd amd64 checksum from upstream checksums.txt
      ansible.builtin.include_tasks: tasks/fetch-checksum-from-file.yml
      vars:
        checksum_file_url: "https://github.com/gastownhall/beads/releases/download/{{ fetched_beads_go_tag }}/checksums.txt"
        checksum_target_filename: "beads_{{ _bd_stripped_version }}_linux_amd64.tar.gz"

    - name: Save bd amd64 fetched checksum
      ansible.builtin.set_fact:
        fetched_beads_go_sha256_amd64: "{{ fetched_checksum }}"

    - name: Fetch bd arm64 checksum from upstream checksums.txt
      ansible.builtin.include_tasks: tasks/fetch-checksum-from-file.yml
      vars:
        checksum_file_url: "https://github.com/gastownhall/beads/releases/download/{{ fetched_beads_go_tag }}/checksums.txt"
        checksum_target_filename: "beads_{{ _bd_stripped_version }}_linux_arm64.tar.gz"

    - name: Save bd arm64 fetched checksum
      ansible.builtin.set_fact:
        fetched_beads_go_sha256_arm64: "{{ fetched_checksum }}"

    - name: Update beads_go_version in beads_go role defaults
      ansible.builtin.replace:
        path: "{{ _roles_dir }}/beads_go/defaults/main.yml"
        regexp: 'beads_go_version:\s*"[^"]+"'
        replace: 'beads_go_version: "{{ fetched_beads_go_tag }}"'

    - name: Update beads_go_sha256_amd64 in beads_go role defaults
      ansible.builtin.replace:
        path: "{{ _roles_dir }}/beads_go/defaults/main.yml"
        regexp: 'beads_go_sha256_amd64:\s*"[^"]+"'
        replace: 'beads_go_sha256_amd64: "{{ fetched_beads_go_sha256_amd64 }}"'

    - name: Update beads_go_sha256_arm64 in beads_go role defaults
      ansible.builtin.replace:
        path: "{{ _roles_dir }}/beads_go/defaults/main.yml"
        regexp: 'beads_go_sha256_arm64:\s*"[^"]+"'
        replace: 'beads_go_sha256_arm64: "{{ fetched_beads_go_sha256_arm64 }}"'

    # bv: raw tag pinned, no stripping needed anywhere (filename version-agnostic)
    - name: Fetch bv amd64 checksum from upstream checksums.txt
      ansible.builtin.include_tasks: tasks/fetch-checksum-from-file.yml
      vars:
        checksum_file_url: "https://github.com/Dicklesworthstone/beads_viewer/releases/download/{{ fetched_beads_viewer_tag }}/checksums.txt"
        checksum_target_filename: "bv_linux_amd64.tar.gz"

    - name: Save bv amd64 fetched checksum
      ansible.builtin.set_fact:
        fetched_beads_viewer_sha256_amd64: "{{ fetched_checksum }}"

    - name: Fetch bv arm64 checksum from upstream checksums.txt
      ansible.builtin.include_tasks: tasks/fetch-checksum-from-file.yml
      vars:
        checksum_file_url: "https://github.com/Dicklesworthstone/beads_viewer/releases/download/{{ fetched_beads_viewer_tag }}/checksums.txt"
        checksum_target_filename: "bv_linux_arm64.tar.gz"

    - name: Save bv arm64 fetched checksum
      ansible.builtin.set_fact:
        fetched_beads_viewer_sha256_arm64: "{{ fetched_checksum }}"

    - name: Update beads_viewer_version in beads_viewer role defaults
      ansible.builtin.replace:
        path: "{{ _roles_dir }}/beads_viewer/defaults/main.yml"
        regexp: 'beads_viewer_version:\s*"[^"]+"'
        replace: 'beads_viewer_version: "{{ fetched_beads_viewer_tag }}"'

    - name: Update beads_viewer_sha256_amd64 in beads_viewer role defaults
      ansible.builtin.replace:
        path: "{{ _roles_dir }}/beads_viewer/defaults/main.yml"
        regexp: 'beads_viewer_sha256_amd64:\s*"[^"]+"'
        replace: 'beads_viewer_sha256_amd64: "{{ fetched_beads_viewer_sha256_amd64 }}"'

    - name: Update beads_viewer_sha256_arm64 in beads_viewer role defaults
      ansible.builtin.replace:
        path: "{{ _roles_dir }}/beads_viewer/defaults/main.yml"
        regexp: 'beads_viewer_sha256_arm64:\s*"[^"]+"'
        replace: 'beads_viewer_sha256_arm64: "{{ fetched_beads_viewer_sha256_arm64 }}"'

    # br: raw tag pinned as source of truth; stripped filename-variant is
    # derived from it in-role (roles/beads_rust/tasks/main.yml), not pinned
    # separately. Checksum source is the per-archive "<filename>.sha256"
    # sidecar file (not a combined checksums file -- upstream has changed the
    # combined file's name across releases: checksums.sha256, then
    # SHA256SUMS/SHA256SUMS.txt). Verified for v0.3.2 that the sidecar files
    # match the real archive contents (downloaded and sha256sum'd directly).
    - name: Derive stripped br version for filename computation
      ansible.builtin.set_fact:
        _br_stripped_version: "{{ fetched_beads_rust_tag | regex_replace('^v', '') }}"

    - name: Fetch br amd64 checksum from upstream sidecar file
      ansible.builtin.include_tasks: tasks/fetch-checksum-from-file.yml
      vars:
        checksum_file_url: "https://github.com/Dicklesworthstone/beads_rust/releases/download/{{ fetched_beads_rust_tag }}/br-{{ _br_stripped_version }}-linux_amd64.tar.gz.sha256"
        checksum_target_filename: "br-{{ _br_stripped_version }}-linux_amd64.tar.gz"

    - name: Save br amd64 fetched checksum
      ansible.builtin.set_fact:
        fetched_beads_rust_sha256_amd64: "{{ fetched_checksum }}"

    - name: Fetch br arm64 checksum from upstream sidecar file
      ansible.builtin.include_tasks: tasks/fetch-checksum-from-file.yml
      vars:
        checksum_file_url: "https://github.com/Dicklesworthstone/beads_rust/releases/download/{{ fetched_beads_rust_tag }}/br-{{ _br_stripped_version }}-linux_arm64.tar.gz.sha256"
        checksum_target_filename: "br-{{ _br_stripped_version }}-linux_arm64.tar.gz"

    - name: Save br arm64 fetched checksum
      ansible.builtin.set_fact:
        fetched_beads_rust_sha256_arm64: "{{ fetched_checksum }}"

    - name: Update beads_rust_version in beads_rust role defaults
      ansible.builtin.replace:
        path: "{{ _roles_dir }}/beads_rust/defaults/main.yml"
        regexp: 'beads_rust_version:\s*"[^"]+"'
        replace: 'beads_rust_version: "{{ fetched_beads_rust_tag }}"'

    - name: Update beads_rust_sha256_amd64 in beads_rust role defaults
      ansible.builtin.replace:
        path: "{{ _roles_dir }}/beads_rust/defaults/main.yml"
        regexp: 'beads_rust_sha256_amd64:\s*"[^"]+"'
        replace: 'beads_rust_sha256_amd64: "{{ fetched_beads_rust_sha256_amd64 }}"'

    - name: Update beads_rust_sha256_arm64 in beads_rust role defaults
      ansible.builtin.replace:
        path: "{{ _roles_dir }}/beads_rust/defaults/main.yml"
        regexp: 'beads_rust_sha256_arm64:\s*"[^"]+"'
        replace: 'beads_rust_sha256_arm64: "{{ fetched_beads_rust_sha256_arm64 }}"'

    # Node.js: version and both per-arch sha256 checksums updated together
    - name: Fetch Node.js x64 checksum from upstream SHASUMS256.txt
      ansible.builtin.include_tasks: tasks/fetch-checksum-from-file.yml
      vars:
        checksum_file_url: "https://nodejs.org/dist/{{ fetched_nodejs_version }}/SHASUMS256.txt"
        checksum_target_filename: "node-{{ fetched_nodejs_version }}-linux-x64.tar.gz"

    - name: Save Node.js x64 fetched checksum
      ansible.builtin.set_fact:
        fetched_node_sha256_x64: "{{ fetched_checksum }}"

    - name: Fetch Node.js arm64 checksum from upstream SHASUMS256.txt
      ansible.builtin.include_tasks: tasks/fetch-checksum-from-file.yml
      vars:
        checksum_file_url: "https://nodejs.org/dist/{{ fetched_nodejs_version }}/SHASUMS256.txt"
        checksum_target_filename: "node-{{ fetched_nodejs_version }}-linux-arm64.tar.gz"

    - name: Save Node.js arm64 fetched checksum
      ansible.builtin.set_fact:
        fetched_node_sha256_arm64: "{{ fetched_checksum }}"

    - name: Update node_version in nodejs role defaults
      ansible.builtin.replace:
        path: "{{ _roles_dir }}/nodejs/defaults/main.yml"
        regexp: 'node_version:\s*"[^"]+"'
        replace: 'node_version: "{{ fetched_nodejs_version }}"'

    - name: Update node_sha256_x64 in nodejs role defaults
      ansible.builtin.replace:
        path: "{{ _roles_dir }}/nodejs/defaults/main.yml"
        regexp: 'node_sha256_x64:\s*"[^"]+"'
        replace: 'node_sha256_x64: "{{ fetched_node_sha256_x64 }}"'

    - name: Update node_sha256_arm64 in nodejs role defaults
      ansible.builtin.replace:
        path: "{{ _roles_dir }}/nodejs/defaults/main.yml"
        regexp: 'node_sha256_arm64:\s*"[^"]+"'
        replace: 'node_sha256_arm64: "{{ fetched_node_sha256_arm64 }}"'

    # specify-cli: version only, no checksum (pipx git-tag install, not a
    # binary/archive download)
    - name: Update specify_cli_version in specify_cli role defaults
      ansible.builtin.replace:
        path: "{{ _roles_dir }}/specify_cli/defaults/main.yml"
        regexp: 'specify_cli_version:\s*"[^"]+"'
        replace: 'specify_cli_version: "{{ fetched_specify_cli_tag }}"'

    # Claude Code: version (stripped, no v-prefix) + both platform checksums
    # updated together, all sourced from the per-version manifest.json (no
    # tarball download/stat needed -- the manifest already provides checksums)
    - name: Update claude_code_version in claude_code role defaults
      ansible.builtin.replace:
        path: "{{ _roles_dir }}/claude_code/defaults/main.yml"
        regexp: 'claude_code_version:\s*"[^"]+"'
        replace: 'claude_code_version: "{{ fetched_claude_code_version }}"'

    - name: Update claude_code_sha256_linux_x64 in claude_code role defaults
      ansible.builtin.replace:
        path: "{{ _roles_dir }}/claude_code/defaults/main.yml"
        regexp: 'claude_code_sha256_linux_x64:\s*"[^"]+"'
        replace: 'claude_code_sha256_linux_x64: "{{ fetched_claude_code_sha256_linux_x64 }}"'

    - name: Update claude_code_sha256_linux_arm64 in claude_code role defaults
      ansible.builtin.replace:
        path: "{{ _roles_dir }}/claude_code/defaults/main.yml"
        regexp: 'claude_code_sha256_linux_arm64:\s*"[^"]+"'
        replace: 'claude_code_sha256_linux_arm64: "{{ fetched_claude_code_sha256_linux_arm64 }}"'

    # skill-manager: commit SHA only, no checksum (built from source at a
    # pinned commit on the upstream default branch, no release artefact)
    - name: Update skill_manager_version in skill_manager role defaults
      ansible.builtin.replace:
        path: "{{ _roles_dir }}/skill_manager/defaults/main.yml"
        regexp: 'skill_manager_version:\s*"[^"]+"'
        replace: 'skill_manager_version: "{{ fetched_skill_manager_sha }}"'

    - name: Download direnv linux-amd64 binary for sha256 computation
      ansible.builtin.get_url:
        url: "https://github.com/direnv/direnv/releases/download/{{ fetched_direnv_tag }}/direnv.linux-amd64"
        dest: "/tmp/direnv-{{ fetched_direnv_tag }}-linux-amd64"
        mode: '0644'

    - name: Compute sha256 of direnv linux-amd64 binary
      ansible.builtin.stat:
        path: "/tmp/direnv-{{ fetched_direnv_tag }}-linux-amd64"
        checksum_algorithm: sha256
        get_checksum: true
      register: _direnv_amd64_stat

    - name: Download direnv linux-arm64 binary for sha256 computation
      ansible.builtin.get_url:
        url: "https://github.com/direnv/direnv/releases/download/{{ fetched_direnv_tag }}/direnv.linux-arm64"
        dest: "/tmp/direnv-{{ fetched_direnv_tag }}-linux-arm64"
        mode: '0644'

    - name: Compute sha256 of direnv linux-arm64 binary
      ansible.builtin.stat:
        path: "/tmp/direnv-{{ fetched_direnv_tag }}-linux-arm64"
        checksum_algorithm: sha256
        get_checksum: true
      register: _direnv_arm64_stat

    - name: Update direnv_version in direnv role defaults
      ansible.builtin.replace:
        path: "{{ _roles_dir }}/direnv/defaults/main.yml"
        regexp: 'direnv_version:\s*"[^"]+"'
        replace: 'direnv_version: "{{ fetched_direnv_tag }}"'

    - name: Update direnv_sha256_amd64 in direnv role defaults
      ansible.builtin.replace:
        path: "{{ _roles_dir }}/direnv/defaults/main.yml"
        regexp: 'direnv_sha256_amd64:\s*"[^"]+"'
        replace: 'direnv_sha256_amd64: "{{ _direnv_amd64_stat.stat.checksum }}"'

    - name: Update direnv_sha256_arm64 in direnv role defaults
      ansible.builtin.replace:
        path: "{{ _roles_dir }}/direnv/defaults/main.yml"
        regexp: 'direnv_sha256_arm64:\s*"[^"]+"'
        replace: 'direnv_sha256_arm64: "{{ _direnv_arm64_stat.stat.checksum }}"'
