      when: >-
        'specify_cli' in (_update_failures
                     | selectattr('phase', 'equalto', 'fetch')
                     | map(attribute='tool') | list)

    - name: Apply specify_cli updates
      when: >-
        'specify_cli' not in (_update_failures
                         | selectattr('phase', 'equalto', 'fetch')
                         | map(attribute='tool') | list)
      block:
        - name: Write specify_cli pins
          ansible.builtin.include_tasks: tasks/write-pins.yml
          vars:
            pin_file: "{{ _roles_dir }}/specify_cli/defaults/main.yml"
            pins:
              - pin: specify_cli_version
                value: "{{ fetched_specify_cli_tag }}"

        - name: Record that specify_cli was updated
          ansible.builtin.set_fact:
            _update_updated: "{{ _update_updated + ['specify_cli'] }}"
      rescue:
        - name: Record the apply failure of specify_cli
          ansible.builtin.include_tasks: tasks/record-tool-failure.yml
          vars:
            failed_tool: specify_cli
            failed_phase: apply
            failed_task_name: "{{ ansible_failed_task.name }}"
            failed_task_action: "{{ ansible_failed_task.action }}"
            failed_task_resolved_action: "{{ ansible_failed_task._resolved_action | default('') }}"
            failed_result: "{{ ansible_failed_result }}"

    # Claude Code: version (stripped, no v-prefix) + both platform checksums
    # updated together, all sourced from the per-version manifest.json (no
    # tarball download/stat needed -- the manifest already provides checksums)
    - name: Record that claude_code was skipped
      ansible.builtin.set_fact:
        _update_skipped: "{{ _update_skipped + ['claude_code'] }}"
      when: >-
        'claude_code' in (_update_failures
                     | selectattr('phase', 'equalto', 'fetch')
                     | map(attribute='tool') | list)

    - name: Apply claude_code updates
      when: >-
        'claude_code' not in (_update_failures
                         | selectattr('phase', 'equalto', 'fetch')
                         | map(attribute='tool') | list)
      block:
        - name: Write claude_code pins
          ansible.builtin.include_tasks: tasks/write-pins.yml
          vars:
            pin_file: "{{ _roles_dir }}/claude_code/defaults/main.yml"
            pins:
              - pin: claude_code_version
                value: "{{ fetched_claude_code_version }}"
              - pin: claude_code_sha256_linux_x64
                value: "{{ fetched_claude_code_sha256_linux_x64 }}"
              - pin: claude_code_sha256_linux_arm64
                value: "{{ fetched_claude_code_sha256_linux_arm64 }}"

        - name: Record that claude_code was updated
          ansible.builtin.set_fact:
            _update_updated: "{{ _update_updated + ['claude_code'] }}"
      rescue:
        - name: Record the apply failure of claude_code
          ansible.builtin.include_tasks: tasks/record-tool-failure.yml
          vars:
            failed_tool: claude_code
            failed_phase: apply
            failed_task_name: "{{ ansible_failed_task.name }}"
            failed_task_action: "{{ ansible_failed_task.action }}"
            failed_task_resolved_action: "{{ ansible_failed_task._resolved_action | default('') }}"
            failed_result: "{{ ansible_failed_result }}"

    # skill-manager: commit SHA only, no checksum (built from source at a
    # pinned commit on the upstream default branch, no release artefact)
    - name: Record that skill_manager was skipped
      ansible.builtin.set_fact:
        _update_skipped: "{{ _update_skipped + ['skill_manager'] }}"
      when: >-
        'skill_manager' in (_update_failures
                     | selectattr('phase', 'equalto', 'fetch')
                     | map(attribute='tool') | list)

    - name: Apply skill_manager updates
      when: >-
        'skill_manager' not in (_update_failures
                         | selectattr('phase', 'equalto', 'fetch')
                         | map(attribute='tool') | list)
      block:
        - name: Write skill_manager pins
          ansible.builtin.include_tasks: tasks/write-pins.yml
          vars:
            pin_file: "{{ _roles_dir }}/skill_manager/defaults/main.yml"
            pins:
              - pin: skill_manager_version
                value: "{{ fetched_skill_manager_sha }}"

        - name: Record that skill_manager was updated
          ansible.builtin.set_fact:
            _update_updated: "{{ _update_updated + ['skill_manager'] }}"
      rescue:
        - name: Record the apply failure of skill_manager
          ansible.builtin.include_tasks: tasks/record-tool-failure.yml
          vars:
            failed_tool: skill_manager
            failed_phase: apply
            failed_task_name: "{{ ansible_failed_task.name }}"
            failed_task_action: "{{ ansible_failed_task.action }}"
            failed_task_resolved_action: "{{ ansible_failed_task._resolved_action | default('') }}"
            failed_result: "{{ ansible_failed_result }}"

    - name: Record that direnv was skipped
      ansible.builtin.set_fact:
        _update_skipped: "{{ _update_skipped + ['direnv'] }}"
      when: >-
        'direnv' in (_update_failures
                     | selectattr('phase', 'equalto', 'fetch')
                     | map(attribute='tool') | list)

    - name: Apply direnv updates
      when: >-
        'direnv' not in (_update_failures
                         | selectattr('phase', 'equalto', 'fetch')
                         | map(attribute='tool') | list)
      block:
        - name: "upstream: Download direnv linux-amd64 binary for sha256 computation"  # noqa: name[casing]
          ansible.builtin.get_url:
            url: "https://github.com/direnv/direnv/releases/download/{{ fetched_direnv_tag }}/direnv.linux-amd64"
            dest: "/tmp/direnv-{{ fetched_direnv_tag }}-linux-amd64"
            mode: '0644'

        - name: Compute sha256 of direnv linux-amd64 binary
          ansible.builtin.stat:
            path: "/tmp/direnv-{{ fetched_direnv_tag }}-linux-amd64"
            checksum_algorithm: sha256
            get_checksum: true
          register: _direnv_amd64_stat

        - name: "upstream: Download direnv linux-arm64 binary for sha256 computation"  # noqa: name[casing]
          ansible.builtin.get_url:
            url: "https://github.com/direnv/direnv/releases/download/{{ fetched_direnv_tag }}/direnv.linux-arm64"
            dest: "/tmp/direnv-{{ fetched_direnv_tag }}-linux-arm64"
            mode: '0644'

        - name: Compute sha256 of direnv linux-arm64 binary
          ansible.builtin.stat:
            path: "/tmp/direnv-{{ fetched_direnv_tag }}-linux-arm64"
            checksum_algorithm: sha256
            get_checksum: true
          register: _direnv_arm64_stat

        - name: Write direnv pins
          ansible.builtin.include_tasks: tasks/write-pins.yml
          vars:
            pin_file: "{{ _roles_dir }}/direnv/defaults/main.yml"
            pins:
              - pin: direnv_version
                value: "{{ fetched_direnv_tag }}"
              - pin: direnv_sha256_amd64
                value: "{{ _direnv_amd64_stat.stat.checksum }}"
              - pin: direnv_sha256_arm64
                value: "{{ _direnv_arm64_stat.stat.checksum }}"

        - name: Record that direnv was updated
          ansible.builtin.set_fact:
            _update_updated: "{{ _update_updated + ['direnv'] }}"
      rescue:
        - name: Record the apply failure of direnv
          ansible.builtin.include_tasks: tasks/record-tool-failure.yml
          vars:
            failed_tool: direnv
            failed_phase: apply
            failed_task_name: "{{ ansible_failed_task.name }}"
            failed_task_action: "{{ ansible_failed_task.action }}"
            failed_task_resolved_action: "{{ ansible_failed_task._resolved_action | default('') }}"
            failed_result: "{{ ansible_failed_result }}"

    # --- Account for every tool, then report ---
    - name: Assert every tracked tool has exactly one apply outcome
      vars:
        _failed_in_apply: >-
          {{ _update_failures | selectattr('phase', 'equalto', 'apply')
             | map(attribute='tool') | list }}
        _outcomes: "{{ _update_updated + _update_skipped + _failed_in_apply }}"
      ansible.builtin.assert:
        that:
          - _outcomes | length == _tracked_tools | length
          - _outcomes | unique | length == _outcomes | length
          - _outcomes | difference(_tracked_tools) | length == 0
          - _tracked_tools | difference(_outcomes) | length == 0
        fail_msg: >-
          Accounting is inconsistent: updated={{ _update_updated }},
          skipped={{ _update_skipped }}, failed in apply={{ _failed_in_apply }},
          tracked={{ _tracked_tools }}.
        quiet: true

    - name: Assert the skipped tools are exactly those whose fetch failed
      vars:
        _failed_in_fetch: >-
          {{ _update_failures | selectattr('phase', 'equalto', 'fetch')
             | map(attribute='tool') | list }}
      ansible.builtin.assert:
        that:
          - _update_skipped | difference(_failed_in_fetch) | length == 0
          - _failed_in_fetch | difference(_update_skipped) | length == 0
        fail_msg: >-
          Skipped tools {{ _update_skipped }} do not match the tools whose fetch
          failed {{ _failed_in_fetch }}; a guard is keyed wrongly, so a healthy
          tool was silently left unwritten or a failed one was written anyway.
        quiet: true

    - name: Report the run
      ansible.builtin.include_tasks: tasks/report-update-failures.yml
      when: _update_failures | length > 0

    - name: Report a clean run
      ansible.builtin.debug:
        msg: >-
          Updated {{ _update_updated | length }} of
          {{ _tracked_tools | length }} tools: {{ _update_updated | join(', ') }}
      when: _update_failures | length == 0
