            failed_task_resolved_action: "{{ ansible_failed_task._resolved_action | default('') }}"
            failed_result: "{{ ansible_failed_result }}"

    - name: Fetch opencode upstream data
      block:
        - name: Fetch OpenCode upstream version
          ansible.builtin.include_tasks: tasks/fetch-github-release.yml
          vars:
            github_repo: "anomalyco/opencode"
            required_asset_regexes:
              - '^opencode-linux-x64\.tar\.gz$'
              - '^opencode-linux-arm64\.tar\.gz$'

        - name: Save OpenCode fetched tag
          ansible.builtin.set_fact:
            fetched_opencode_tag: "{{ fetched_github_tag }}"
      rescue:
        - name: Record the fetch failure of opencode
          ansible.builtin.include_tasks: tasks/record-tool-failure.yml
          vars:
