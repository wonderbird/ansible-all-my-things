    # Java (Temurin)
    - name: Record that java was skipped
      ansible.builtin.set_fact:
        _update_skipped: "{{ _update_skipped + ['java'] }}"
      when: >-
        'java' in (_update_failures
                     | selectattr('phase', 'equalto', 'fetch')
                     | map(attribute='tool') | list)

    - name: Apply java updates
