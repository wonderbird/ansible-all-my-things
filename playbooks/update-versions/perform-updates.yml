            failed_phase: fetch
            failed_task_name: "{{ ansible_failed_task.name }}"
            failed_task_action: "{{ ansible_failed_task.action }}"
            failed_task_resolved_action: "{{ ansible_failed_task._resolved_action | default('') }}"
            failed_result: "{{ ansible_failed_result }}"

    - name: Fetch beads_viewer upstream data
      block:
        - name: Fetch bv upstream version
          ansible.builtin.include_tasks: tasks/fetch-github-release.yml
          vars:
            github_repo: "Dicklesworthstone/beads_viewer"
            required_asset_regexes:
              - '^bv_.*_linux_amd64\.tar\.gz$'
              - '^bv_.*_linux_arm64\.tar\.gz$'
              - '^checksums\.txt$'

        - name: Save bv fetched tag
          ansible.builtin.set_fact:
            fetched_beads_viewer_tag: "{{ fetched_github_tag }}"
      rescue:
        - name: Record the fetch failure of beads_viewer
          ansible.builtin.include_tasks: tasks/record-tool-failure.yml
          vars:
            failed_tool: beads_viewer
            failed_phase: fetch
            failed_task_name: "{{ ansible_failed_task.name }}"
            failed_task_action: "{{ ansible_failed_task.action }}"
            failed_task_resolved_action: "{{ ansible_failed_task._resolved_action | default('') }}"
            failed_result: "{{ ansible_failed_result }}"

    - name: Fetch beads_rust upstream data
      block:
        - name: Fetch br upstream version
          ansible.builtin.include_tasks: tasks/fetch-github-release.yml
          vars:
            github_repo: "Dicklesworthstone/beads_rust"
            required_asset_regexes:
              - '^br-.*-linux_amd64\.tar\.gz$'
              - '^br-.*-linux_amd64\.tar\.gz\.sha256$'
              - '^br-.*-linux_arm64\.tar\.gz$'
              - '^br-.*-linux_arm64\.tar\.gz\.sha256$'

        - name: Save br fetched tag
          ansible.builtin.set_fact:
            fetched_beads_rust_tag: "{{ fetched_github_tag }}"
      rescue:
        - name: Record the fetch failure of beads_rust
          ansible.builtin.include_tasks: tasks/record-tool-failure.yml
          vars:
            failed_tool: beads_rust
            failed_phase: fetch
            failed_task_name: "{{ ansible_failed_task.name }}"
            failed_task_action: "{{ ansible_failed_task.action }}"
            failed_task_resolved_action: "{{ ansible_failed_task._resolved_action | default('') }}"
            failed_result: "{{ ansible_failed_result }}"

    - name: Fetch nodejs upstream data
      block:
        - name: Fetch Node.js upstream LTS version
          ansible.builtin.include_tasks: tasks/fetch-nodejs-version.yml
      rescue:
        - name: Record the fetch failure of nodejs
          ansible.builtin.include_tasks: tasks/record-tool-failure.yml
          vars:
            failed_tool: nodejs
            failed_phase: fetch
            failed_task_name: "{{ ansible_failed_task.name }}"
            failed_task_action: "{{ ansible_failed_task.action }}"
            failed_task_resolved_action: "{{ ansible_failed_task._resolved_action | default('') }}"
            failed_result: "{{ ansible_failed_result }}"

    - name: Fetch specify_cli upstream data
      block:
        - name: Fetch specify-cli upstream version
          ansible.builtin.include_tasks: tasks/fetch-github-release.yml
          vars:
            github_repo: "github/spec-kit"
            release_carries_no_consumed_asset: "installed with pipx from the git tag, not from release assets"

        - name: Save specify-cli fetched tag
          ansible.builtin.set_fact:
            fetched_specify_cli_tag: "{{ fetched_github_tag }}"
      rescue:
        - name: Record the fetch failure of specify_cli
          ansible.builtin.include_tasks: tasks/record-tool-failure.yml
          vars:
            failed_tool: specify_cli
            failed_phase: fetch
            failed_task_name: "{{ ansible_failed_task.name }}"
            failed_task_action: "{{ ansible_failed_task.action }}"
            failed_task_resolved_action: "{{ ansible_failed_task._resolved_action | default('') }}"
            failed_result: "{{ ansible_failed_result }}"

    - name: Fetch claude_code upstream data
      block:
        - name: Fetch Claude Code upstream version and checksums
          ansible.builtin.include_tasks: tasks/fetch-claude-code-version.yml
      rescue:
        - name: Record the fetch failure of claude_code
          ansible.builtin.include_tasks: tasks/record-tool-failure.yml
          vars:
            failed_tool: claude_code
