      ansible.builtin.set_fact:
        _update_skipped: "{{ _update_skipped + ['tmux'] }}"
      when: >-
        'tmux' in (_update_failures
                     | selectattr('phase', 'equalto', 'fetch')
                     | map(attribute='tool') | list)

    - name: Apply tmux updates
      when: >-
        'tmux' not in (_update_failures
                         | selectattr('phase', 'equalto', 'fetch')
                         | map(attribute='tool') | list)
      block:
        - name: Write tmux pins
          ansible.builtin.include_tasks: tasks/write-pins.yml
          vars:
            pin_file: "{{ _roles_dir }}/tmux/defaults/main.yml"
            pins:
              - pin: tmux_gitmux_version
                value: "{{ fetched_gitmux_tag }}"

        - name: Record that tmux was updated
          ansible.builtin.set_fact:
            _update_updated: "{{ _update_updated + ['tmux'] }}"
      rescue:
        - name: Record the apply failure of tmux
          ansible.builtin.include_tasks: tasks/record-tool-failure.yml
          vars:
            failed_tool: tmux
            failed_phase: apply
            failed_task_name: "{{ ansible_failed_task.name }}"
            failed_task_action: "{{ ansible_failed_task.action }}"
            failed_task_resolved_action: "{{ ansible_failed_task._resolved_action | default('') }}"
            failed_result: "{{ ansible_failed_result }}"

    # Nerd Fonts (Hack)
