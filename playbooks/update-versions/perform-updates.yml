                         | selectattr('phase', 'equalto', 'fetch')
                         | map(attribute='tool') | list)
      block:
        - name: Write nerd_font pins
          ansible.builtin.include_tasks: tasks/write-pins.yml
          vars:
            pin_file: "{{ _roles_dir }}/nerd_font/defaults/main.yml"
            pins:
              - pin: nerd_font_version
                value: "{{ fetched_font_tag }}"

        - name: Record that nerd_font was updated
          ansible.builtin.set_fact:
            _update_updated: "{{ _update_updated + ['nerd_font'] }}"
      rescue:
        - name: Record the apply failure of nerd_font
          ansible.builtin.include_tasks: tasks/record-tool-failure.yml
