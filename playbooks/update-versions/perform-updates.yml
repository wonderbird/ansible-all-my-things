---
# Check mode is NOT supported: under --check, ansible.builtin.uri skips while
# ansible.builtin.get_url still performs its request, so a check run mixes real
# downloads with skipped fetches and reports failures that a real run would not
# have. Run this playbook for real, or not at all.
#
# One tool's upstream outage must not hide every later tool, so each tool runs
# inside a fetch block and an apply block with a rescue. Third-party failures
# accumulate in _update_failures and the run reports all of them at the end; a
# configuration error stops the run at once. Which failures count as which is
# decided in tasks/record-tool-failure.yml.
#
# Every block guard reads only the facts initialised below and uses no attribute
# access that can be undefined: a templating error inside a block's own `when:`
# is NOT caught by that block's rescue -- the rescue tasks inherit the same
# `when:`, fail again, and the play aborts past its own error handling.
- name: Update pinned versions in role defaults files
  hosts: localhost
  gather_facts: false
  vars:
    _roles_dir: "{{ playbook_dir }}/../../roles"
    # The tools this playbook maintains. Declared rather than derived, so the
    # accounting assert below compares two independently written sets instead of
    # comparing a set with itself.
    _tracked_tools:
      - flutter
      - tmux
      - nerd_font
      - java
      - android_studio
      - dolt_sql_server
      - opencode
      - github_cli
      - obsidian
      - rtk
      - beads_go
      - beads_viewer
      - beads_rust
      - nodejs
      - specify_cli
      - claude_code
      - skill_manager
      - direnv
  tasks:
    - name: Initialise the run ledgers
      ansible.builtin.set_fact:
        _update_failures: []
        _update_updated: []
        _update_skipped: []

    # --- Fetch upstream versions ---
    - name: Fetch flutter upstream data
      block:
        - name: Fetch Flutter upstream version
          ansible.builtin.include_tasks: tasks/fetch-flutter-version.yml
      rescue:
        - name: Record the fetch failure of flutter
          ansible.builtin.include_tasks: tasks/record-tool-failure.yml
          vars:
            failed_tool: flutter
            failed_phase: fetch
            failed_task_name: "{{ ansible_failed_task.name }}"
            failed_task_action: "{{ ansible_failed_task.action }}"
            failed_task_resolved_action: "{{ ansible_failed_task._resolved_action | default('') }}"
            failed_result: "{{ ansible_failed_result }}"

    - name: Fetch tmux upstream data
      block:
        - name: Fetch gitmux upstream version
          ansible.builtin.include_tasks: tasks/fetch-github-release.yml
          vars:
            github_repo: "arl/gitmux"
            required_asset_regexes:
              - '^gitmux_.*_linux_amd64\.tar\.gz$'
              - '^gitmux_.*_linux_arm64\.tar\.gz$'
              - '^checksums\.txt$'

        - name: Save gitmux fetched tag
          ansible.builtin.set_fact:
            fetched_gitmux_tag: "{{ fetched_github_tag }}"
      rescue:
        - name: Record the fetch failure of tmux
          ansible.builtin.include_tasks: tasks/record-tool-failure.yml
          vars:
            failed_tool: tmux
            failed_phase: fetch
            failed_task_name: "{{ ansible_failed_task.name }}"
            failed_task_action: "{{ ansible_failed_task.action }}"
            failed_task_resolved_action: "{{ ansible_failed_task._resolved_action | default('') }}"
            failed_result: "{{ ansible_failed_result }}"

    - name: Fetch nerd_font upstream data
      block:
        - name: Fetch Nerd Fonts (Hack) upstream version
          ansible.builtin.include_tasks: tasks/fetch-github-release.yml
          vars:
            github_repo: "ryanoasis/nerd-fonts"
            required_asset_regexes:
              - '^Hack\.zip$'

        - name: Save Nerd Fonts fetched tag
          ansible.builtin.set_fact:
            fetched_font_tag: "{{ fetched_github_tag }}"
      rescue:
        - name: Record the fetch failure of nerd_font
          ansible.builtin.include_tasks: tasks/record-tool-failure.yml
          vars:
            failed_tool: nerd_font
            failed_phase: fetch
            failed_task_name: "{{ ansible_failed_task.name }}"
            failed_task_action: "{{ ansible_failed_task.action }}"
            failed_task_resolved_action: "{{ ansible_failed_task._resolved_action | default('') }}"
            failed_result: "{{ ansible_failed_result }}"

    - name: Fetch java upstream data
      block:
        # --- Read current Java identifier to derive major version for fetch ---
        - name: Read java role defaults
          ansible.builtin.slurp:
            src: "{{ _roles_dir }}/java/defaults/main.yml"
          register: _java_defaults_raw

        - name: Derive Java major version from current identifier
          vars:
            _java_id_match: >-
              {{ _java_defaults_raw.content | b64decode
                 | regex_search('java_sdkman_identifier:\s*"([^"]+)"', '\1')
                 | default([], true) }}
          ansible.builtin.set_fact:
            _current_java_major: "{{ (_java_id_match | first).split('.')[0] | int }}"

        - name: Fetch Java upstream version for major {{ _current_java_major }}
          ansible.builtin.include_tasks: tasks/fetch-java-version.yml
          vars:
            java_sdkman_major: "{{ _current_java_major }}"
      rescue:
        - name: Record the fetch failure of java
          ansible.builtin.include_tasks: tasks/record-tool-failure.yml
          vars:
            failed_tool: java
            failed_phase: fetch
            failed_task_name: "{{ ansible_failed_task.name }}"
            failed_task_action: "{{ ansible_failed_task.action }}"
            failed_task_resolved_action: "{{ ansible_failed_task._resolved_action | default('') }}"
            failed_result: "{{ ansible_failed_result }}"

    - name: Fetch android_studio upstream data
