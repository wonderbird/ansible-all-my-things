          vars:
            github_repo: "omrikais/skill-manager"
            git_ref: "master"

        - name: Save skill-manager fetched commit SHA
          ansible.builtin.set_fact:
            fetched_skill_manager_sha: "{{ fetched_github_sha }}"
      rescue:
        - name: Record the fetch failure of skill_manager
          ansible.builtin.include_tasks: tasks/record-tool-failure.yml
          vars:
