      block:
        - name: Fetch direnv upstream version
          ansible.builtin.include_tasks: tasks/fetch-github-release.yml
          vars:
            github_repo: "direnv/direnv"
            required_asset_regexes:
              - '^direnv\.linux-amd64$'
              - '^direnv\.linux-arm64$'

        - name: Save direnv fetched tag
          ansible.builtin.set_fact:
            fetched_direnv_tag: "{{ fetched_github_tag }}"
      rescue:
        - name: Record the fetch failure of direnv
          ansible.builtin.include_tasks: tasks/record-tool-failure.yml
          vars:
            failed_tool: direnv
            failed_phase: fetch
            failed_task_name: "{{ ansible_failed_task.name }}"
            failed_task_action: "{{ ansible_failed_task.action }}"
            failed_task_resolved_action: "{{ ansible_failed_task._resolved_action | default('') }}"
            failed_result: "{{ ansible_failed_result }}"

    # --- Apply updates to role defaults files ---

    # Flutter SDK: version and sha256 updated together
    - name: Record that flutter was skipped
      ansible.builtin.set_fact:
        _update_skipped: "{{ _update_skipped + ['flutter'] }}"
      when: >-
        'flutter' in (_update_failures
                     | selectattr('phase', 'equalto', 'fetch')
                     | map(attribute='tool') | list)

    - name: Apply flutter updates
      when: >-
        'flutter' not in (_update_failures
                         | selectattr('phase', 'equalto', 'fetch')
                         | map(attribute='tool') | list)
      block:
        - name: Write flutter pins
          ansible.builtin.include_tasks: tasks/write-pins.yml
          vars:
            pin_file: "{{ _roles_dir }}/flutter/defaults/main.yml"
            pins:
              - pin: flutter_version
                value: "{{ fetched_flutter_version }}"
              - pin: flutter_sha256
                value: "{{ fetched_flutter_sha256 }}"

        - name: Record that flutter was updated
          ansible.builtin.set_fact:
            _update_updated: "{{ _update_updated + ['flutter'] }}"
      rescue:
        - name: Record the apply failure of flutter
          ansible.builtin.include_tasks: tasks/record-tool-failure.yml
          vars:
            failed_tool: flutter
            failed_phase: apply
            failed_task_name: "{{ ansible_failed_task.name }}"
            failed_task_action: "{{ ansible_failed_task.action }}"
            failed_task_resolved_action: "{{ ansible_failed_task._resolved_action | default('') }}"
            failed_result: "{{ ansible_failed_result }}"

    # gitmux
