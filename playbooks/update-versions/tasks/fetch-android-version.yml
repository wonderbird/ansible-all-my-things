---
# Required vars: fetch_call_id
# Sets facts: fetched_android_build, fetched_android_sha256, fetched_for
#
# fetched_for stamps this output with the caller's fetch_call_id, in the same
# set_fact so a skipped output cannot pass as this call's result. Contract:
# ../../../docs/architecture/version-update-playbooks.md (section "Attributing a
# fetch output to the call that produced it").

- name: Fetch Android developer page
  ansible.builtin.uri:
    url: "https://developer.android.com/studio"
    return_content: true
    follow_redirects: all
  register: _android_page_response

- name: Parse the cmdline-tools build number and SHA-256 from the page
  ansible.builtin.include_tasks: parse-android-page.yml
  vars:
    android_page_content: "{{ _android_page_response.content }}"

- name: Set Android build number and SHA-256 facts
  ansible.builtin.set_fact:
    fetched_android_build: "{{ _android_parsed_build }}"
    fetched_android_sha256: "{{ _android_parsed_sha256 }}"
    fetched_for: "{{ fetch_call_id }}"
