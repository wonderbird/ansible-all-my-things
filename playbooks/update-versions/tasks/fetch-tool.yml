---
# Queries one tool's upstream source and records what it returned. Required
# vars: _name (the tool, supplied by the loop), _tools (the registry) and
# _fetch_results (the per-tool results mapping this file adds to).
#
# The block/rescue lives here rather than in the playbook, so every tool is
# isolated by construction: a third-party failure is recorded against this tool
# and the loop continues, while a configuration error stops the run from inside
# record-tool-failure.yml.
#
# The failure-source contract every included fetch file must honour is stated
# once in ../../../docs/architecture/version-update-playbooks.md.
#
# The loop that includes this file iterates tool NAMES and nothing else. A loop
# over whole registry entries would template every expression of every entry
# before the first task runs, and that failure happens outside any block, so no
# rescue could catch it.

- name: "Fetch the upstream data of {{ _name }}"
  block:
    - name: "Query the upstream source of {{ _name }}"
      ansible.builtin.include_tasks: "{{ _tools[_name].fetch.file }}"
      # `vars:` on an include must be a literal mapping, so the argument names
      # are written out and each falls back to omit when this tool does not use
      # it. Adding a fetch argument means adding it here once. Only arguments a
      # fetch task file reads belong here: a registry argument that only the
      # pre-flight inspects is never passed down.
      vars:
        _args: "{{ _tools[_name].fetch.args | default({}) }}"
        github_repo: "{{ _args.github_repo | default(omit) }}"
        git_ref: "{{ _args.git_ref | default(omit) }}"
        java_sdkman_major: "{{ _args.java_sdkman_major | default(omit) }}"
        required_asset_regexes: "{{ _args.required_asset_regexes | default(omit) }}"

    - name: "Record what the fetch of {{ _name }} returned"
      # Bound inside the block: an output the fetch file did not set is
      # undefined here, which is rescued and classified, rather than silently
      # leaving the previous tool's value in place.
      ansible.builtin.set_fact:
        _fetch_results: >-
          {{ _fetch_results | combine({_name: _tools[_name].fetch.results}) }}

  rescue:
    - name: "Record the fetch failure of {{ _name }}"
      ansible.builtin.include_tasks: record-tool-failure.yml
      vars:
        failed_tool: "{{ _name }}"
        failed_phase: fetch
        failed_task_name: "{{ ansible_failed_task.name }}"
        failed_task_action: "{{ ansible_failed_task.action }}"
        failed_task_resolved_action: "{{ ansible_failed_task._resolved_action | default('') }}"
        failed_task_source: "{{ ansible_failed_task.vars.failure_source | default('') }}"
        failed_result: "{{ ansible_failed_result }}"
