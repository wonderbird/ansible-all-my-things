# SPDX-License-Identifier: MIT-0
---
# Writes version and checksum pins into one role defaults file, where a pin
# line has the shape `<pin>: "<value>"` at the start of a line.
#
# Required vars: pin_file (path of one role defaults file),
#                pins (list of {pin, value})
#
# Why this task file exists, what it guarantees, and the alternatives that were
# rejected are documented in ../../../docs/architecture/version-update-playbooks.md
# (section "Writing pins"). Constraints for editing this file:
#
# - A failure here is always a configuration error, never an upstream one, so
#   every task declares failure_source: configuration. A pin that cannot be
#   written is this repository's problem, never a vendor's.
# - Values are substituted unescaped, so the input guard rejects quotes,
#   backslashes and newlines instead. Its patterns are single-quoted YAML vars,
#   not Jinja string literals, so the backslashes reach the regex engine, and
#   they end in \Z because $ also accepts a trailing newline.

- name: Validate inputs for {{ pin_file | default('<undefined pin_file>') }}

  vars:
    failure_source: configuration
    _pin_name_ok: '^[a-z0-9_]+\Z'
    _pin_value_ok: '^[^"\\\n]+\Z'
  ansible.builtin.assert:
    that:
      - pin_file is defined and pin_file | length > 0
      - pins is defined and pins is iterable and pins is not string and pins is not mapping
      - pins | length > 0
      - pins | map(attribute='pin') | select('match', _pin_name_ok) | list | length == pins | length
      - pins | map(attribute='value') | map('string') | select('match', _pin_value_ok) | list | length == pins | length
    fail_msg: "write-pins: invalid inputs for {{ pin_file | default('<undefined>') }}: {{ pins | default('<undefined>') }}"
    quiet: true

- name: Read {{ pin_file }}

  vars:
    failure_source: configuration
  ansible.builtin.slurp:
    src: "{{ pin_file }}"
  register: _write_pins_raw

- name: Assert each pin appears once in {{ pin_file }}

  vars:
    failure_source: configuration
    _pin_regexp: '^{{ _write_pin.pin }}:[ \t]*"[^"\n]+"'
    _pin_count: "{{ _write_pins_raw.content | b64decode | regex_findall(_pin_regexp, multiline=True) | length }}"
  ansible.builtin.assert:
    that: _pin_count | int == 1
    fail_msg: "{{ pin_file }}: pin '{{ _write_pin.pin }}' matched {{ _pin_count }} line(s), expected exactly 1"
    quiet: true
  loop: "{{ pins }}"
  loop_control:
    loop_var: _write_pin
    label: "{{ _write_pin.pin }}"

- name: Write pins in {{ pin_file }}

  vars:
    failure_source: configuration
    _pin_regexp: '^{{ _write_pin.pin }}:[ \t]*"[^"\n]+"'
  ansible.builtin.replace:
    path: "{{ pin_file }}"
    regexp: "{{ _pin_regexp }}"
    replace: '{{ _write_pin.pin }}: "{{ _write_pin.value }}"'
  register: _write_pins_result
  loop: "{{ pins }}"
  loop_control:
    loop_var: _write_pin
    label: "{{ _write_pin.pin }}"
