---
# Sets facts: fetched_claude_code_version (STRIPPED, no "v" prefix),
# fetched_claude_code_sha256_linux_x64, fetched_claude_code_sha256_linux_arm64
#
# The checksum source is a per-version manifest.json lookup, not a raw
# computed tarball hash or a GitHub-Releases tag_name alone, so this composes
# fetch-github-release.yml (for the release tag) with a second uri GET
# against the manifest.
#
# Task naming contract: any task that can fail because of a third party carries
# the "upstream: " name prefix, so a per-tool rescue can tell an outage from a
# defect in this repository. Input asserts stay unprefixed -- a bad argument is
# ours. Quote such a name: an unquoted YAML scalar cannot carry a colon and a
# space. See ../../../docs/architecture/version-update-playbooks.md.

- name: Fetch Claude Code release tag from GitHub Releases
  ansible.builtin.include_tasks: fetch-github-release.yml
  vars:
    github_repo: "anthropics/claude-code"

# fetch-github-release.yml returns the RAW tag (e.g. "v2.1.204"); the
# manifest URL and the pinned claude_code_version fact both use the STRIPPED
# form (see roles/claude_code/tasks/install-claude-code.yml).
- name: Strip 'v' prefix from fetched Claude Code tag
  ansible.builtin.set_fact:
    fetched_claude_code_version: "{{ fetched_github_tag | regex_replace('^v', '') }}"

- name: Fetch Claude Code release manifest
  ansible.builtin.uri:
    # Same base URL as roles/claude_code/defaults/main.yml's
    # claude_code_manifest_base_url -- hardcoded here rather than read from
    # the role's defaults, matching this directory's existing convention
    # (see fetch-flutter-version.yml).
    url: "https://storage.googleapis.com/claude-code-dist-86c565f3-f756-42ad-8dfa-d59b1c096819/claude-code-releases/{{ fetched_claude_code_version }}/manifest.json"
    validate_certs: true
    return_content: true
  register: _claude_code_manifest

- name: "upstream: Assert Claude Code manifest contains required platform keys"  # noqa: name[casing]
  ansible.builtin.assert:
    that:
      - "'linux-x64' in _claude_code_manifest.json.platforms"
      - "'linux-arm64' in _claude_code_manifest.json.platforms"
    fail_msg: >-
      https://storage.googleapis.com/claude-code-dist-86c565f3-f756-42ad-8dfa-d59b1c096819/claude-code-releases/{{ fetched_claude_code_version }}/manifest.json
      is missing one or both required platform keys ('linux-x64',
      'linux-arm64') under .platforms -- cannot resolve Claude Code checksums.

- name: Extract Claude Code checksums from release manifest
  ansible.builtin.set_fact:
    fetched_claude_code_sha256_linux_x64: "{{ _claude_code_manifest.json.platforms['linux-x64'].checksum }}"
    fetched_claude_code_sha256_linux_arm64: "{{ _claude_code_manifest.json.platforms['linux-arm64'].checksum }}"
