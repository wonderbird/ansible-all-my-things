---
# Required variable: github_repo (e.g. "arl/gitmux")
# Sets fact: fetched_github_tag
#
# Optional: required_asset_regexes, a list of patterns. Each must match the
# name of at least one asset of the resolved release, or the include fails.
# The release the API calls "latest" is not necessarily one that carries the
# asset a consumer downloads; see docs/architecture/version-update-playbooks.md
# (section "Guarding release assets") for why this guard exists and where it
# is mandatory. `release_carries_no_consumed_asset` states the opposite claim,
# for a tool installed from somewhere other than the release assets.
#
# Failure-source contract: any task that can fail because of a third party
# declares `failure_source: upstream` in its own vars, so a per-tool rescue can
# tell an outage from a defect in this repository. An input assert declares
# nothing -- a bad argument is ours, and the default class is configuration.
# See ../../../docs/architecture/version-update-playbooks.md.

- name: Normalise the required assets of {{ github_repo }}
  # A caller that passes nothing leaves the omit placeholder here, which is
  # neither a list nor testable for length, so it is turned into an empty list
  # once. Set on every include, so it can never hold a previous tool's value.
  ansible.builtin.set_fact:
    _required_assets: >-
      {{ required_asset_regexes
         if (required_asset_regexes is defined
             and required_asset_regexes is sequence
             and required_asset_regexes is not string
             and required_asset_regexes is not mapping)
         else [] }}

- name: Assert required_asset_regexes is a list of patterns for {{ github_repo }}
  # Whether a caller must declare patterns at all is checked once over the whole
  # registry, in tasks/preflight.yml. This only checks the shape of what was
  # passed, and an include that passes nothing (a caller with no patterns) is
  # skipped rather than rejected here.
  ansible.builtin.assert:
    that:
      - _required_assets | select('string') | list | length == _required_assets | length
      - _required_assets | select('equalto', '') | list | length == 0
    fail_msg: >-
      required_asset_regexes for {{ github_repo }} must be a list of non-empty
      patterns, got '{{ _required_assets }}'.
    quiet: true
  when: _required_assets | length > 0

- name: Fetch GitHub latest release for {{ github_repo }}
  ansible.builtin.uri:
    url: "https://api.github.com/repos/{{ github_repo }}/releases/latest"
    headers:
      Accept: "application/vnd.github+json"
    status_code: [200, 403]
  register: _github_release_response

- name: Fail on GitHub API rate limit for {{ github_repo }}

  vars:

    failure_source: upstream
  ansible.builtin.fail:
    msg: >-
      GitHub API rate limit exceeded for {{ github_repo }}
      (https://api.github.com/repos/{{ github_repo }}/releases/latest).
      Rate limit resets at epoch: {{ _github_release_response.x_ratelimit_reset | default('unknown') }}.
  when:
    - _github_release_response.status == 403
    - (_github_release_response.x_ratelimit_remaining | default('1') | int) == 0

- name: Fail on unexpected GitHub API status for {{ github_repo }}

  vars:

    failure_source: upstream
  ansible.builtin.fail:
    msg: >-
      GitHub API (https://api.github.com/repos/{{ github_repo }}/releases/latest)
      returned unexpected status {{ _github_release_response.status }}
  when: _github_release_response.status != 200

- name: Fail if tag_name missing from GitHub response for {{ github_repo }}

  vars:

    failure_source: upstream
  ansible.builtin.fail:
    msg: >-
      GitHub API (https://api.github.com/repos/{{ github_repo }}/releases/latest)
      response does not contain 'tag_name' field
  when: "'tag_name' not in _github_release_response.json"

- name: Assert required assets exist in the latest release of {{ github_repo }}

  vars:

    failure_source: upstream
  vars:
    _release_tag: "{{ _github_release_response.json.tag_name }}"
    _release_assets: "{{ _github_release_response.json.assets | default([]) | map(attribute='name') | list }}"
  ansible.builtin.assert:
    that: _release_assets | select('match', _required_asset_regex) | list | length > 0
    fail_msg: >-
      {{ github_repo }} release {{ _release_tag }} has no asset matching
      '{{ _required_asset_regex }}' ({{ _release_assets | length }} asset(s) in
      the release) -- the latest release does not carry the asset this tool
      installs.
    quiet: true
  loop: "{{ _required_assets }}"
  loop_control:
    loop_var: _required_asset_regex

- name: Set GitHub tag fact for {{ github_repo }}
  ansible.builtin.set_fact:
    fetched_github_tag: "{{ _github_release_response.json.tag_name }}"
