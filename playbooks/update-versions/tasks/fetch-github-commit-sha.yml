---
# Fetch the HEAD commit SHA of a branch on a GitHub repository. Used for tools
# that ship no tagged releases and are pinned to a commit SHA instead.
#
# Required variables:
#   github_repo (e.g. "omrikais/skill-manager")
#   git_ref     (branch name, e.g. "master")
# Sets fact: fetched_github_sha

- name: Fetch GitHub HEAD commit for {{ github_repo }}@{{ git_ref }}
  ansible.builtin.uri:
    url: "https://api.github.com/repos/{{ github_repo }}/commits/{{ git_ref }}"
    headers:
      Accept: "application/vnd.github+json"
    status_code: [200, 403]
  register: _github_commit_response

- name: Fail on GitHub API rate limit for {{ github_repo }}
  ansible.builtin.fail:
    msg: >-
      GitHub API rate limit exceeded for {{ github_repo }}
      (https://api.github.com/repos/{{ github_repo }}/commits/{{ git_ref }}).
      Rate limit resets at epoch: {{ _github_commit_response.x_ratelimit_reset | default('unknown') }}.
  when:
    - _github_commit_response.status == 403
    - (_github_commit_response.x_ratelimit_remaining | default('1') | int) == 0

- name: Fail on unexpected GitHub API status for {{ github_repo }}
  ansible.builtin.fail:
    msg: >-
      GitHub API (https://api.github.com/repos/{{ github_repo }}/commits/{{ git_ref }})
      returned unexpected status {{ _github_commit_response.status }}
  when: _github_commit_response.status != 200

- name: Fail if sha missing from GitHub response for {{ github_repo }}
  ansible.builtin.fail:
    msg: >-
      GitHub API (https://api.github.com/repos/{{ github_repo }}/commits/{{ git_ref }})
      response does not contain a 'sha' field
  when: "'sha' not in _github_commit_response.json"

- name: Set GitHub commit SHA fact for {{ github_repo }}
  ansible.builtin.set_fact:
    fetched_github_sha: "{{ _github_commit_response.json.sha }}"
