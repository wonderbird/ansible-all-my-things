# Minimal Ansible configuration for the update-versions test harness.
# Select it with ANSIBLE_CONFIG=playbooks/update-versions/tests/ansible.cfg.
# The repository root ansible.cfg is bypassed on purpose: its vault password
# script exits non-zero when no vault secret is set (as on a fork pull
# request), and its inventory is not needed for these localhost-only tests.
[defaults]
interpreter_python = auto_silent
