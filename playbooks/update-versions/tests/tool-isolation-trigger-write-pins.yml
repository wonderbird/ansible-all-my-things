---
# A real write-pins failure, classified by the failure_source the pin-write
# tasks declare.
#
# Required var: _harness_dir, the registered temporary directory.

- name: "Write a pin that does not exist in the fixture"
  ansible.builtin.include_tasks: ../tasks/write-pins.yml
  vars:
    pin_file: "{{ _harness_dir.path }}/write-pins-fixture.yml"
    pins:
      - pin: pin_that_is_absent
        value: "v2"
