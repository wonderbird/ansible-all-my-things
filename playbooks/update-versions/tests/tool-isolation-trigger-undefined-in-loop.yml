---
# Induces an undefined variable inside a loop of an upstream-prefixed task, so
# the veto must beat the prefix even though the message is only in results[].
#
# Reads _harness_variable_that_is_never_set, which NOTHING defines. That is
# the point of this file: defining it removes the failure under test.

- name: Loop over an undefined variable
  vars:
    failure_source: upstream
  ansible.builtin.debug:
    msg: "{{ _harness_variable_that_is_never_set[item] }}"
  loop: [0]
