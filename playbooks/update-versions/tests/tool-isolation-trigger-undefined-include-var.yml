---
# Induces an undefined variable in an include's vars (classifier rule 2).

- name: Include with an undefined var
  vars:
    failure_source: upstream
  ansible.builtin.include_tasks: tool-isolation-trigger-noop.yml
  vars:
    _harness_passed: "{{ _harness_variable_that_is_never_set }}"
