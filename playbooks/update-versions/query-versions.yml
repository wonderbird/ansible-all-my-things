---
# Reports, for every tracked tool, the pin the roles carry and the version
# upstream offers. It writes nothing: perform-updates.yml applies what this
# playbook reports.
#
# One tool's outage no longer ends the query. Each tool is fetched inside its
# own block and rescue, so an unreachable upstream is reported against that tool
# while the rest are still queried. The play still exits non-zero when any pin is
# stale or any tool failed, and a tool nobody could reach is reported as unknown,
# never as up to date.
- name: Query upstream versions for tracked tools
  hosts: localhost
  gather_facts: false
  vars_files:
    - vars/tools.yml
  vars:
    _roles_dir: "{{ playbook_dir }}/../../roles"
    _registry_file: "{{ playbook_dir }}/vars/tools.yml"
    _registry_roles_dir: "{{ _roles_dir }}"
  tasks:
    - name: Check the preconditions of this run
      ansible.builtin.include_tasks: tasks/preflight.yml

    - name: Initialise the run ledgers
      ansible.builtin.set_fact:
        _update_failures: []
        _update_updated: []
        _update_skipped: []
        _fetch_results: {}

    - name: Read the pins the roles carry today
      ansible.builtin.include_tasks: tasks/read-current-pins.yml

    - name: Fetch the upstream data of every tool
      ansible.builtin.include_tasks: tasks/fetch-tool.yml
      # names only: a loop over whole registry entries templates every
      # expression of every entry before the first task runs, outside any block
      loop: "{{ _tools.keys() | list }}"
      loop_control:
        loop_var: _name
        label: "{{ _name }}"

    - name: Report the status of every tool
      vars:
        _failed: "{{ _name in (_update_failures | map(attribute='tool') | list) }}"
        _pinned: "{{ _current[_name][_tools[_name].current_pin] }}"
        _upstream: "{{ _fetch_results[_name].version | default('unknown') }}"
      ansible.builtin.debug:
        msg: >-
          {{ _name }}: current={{ _pinned }},
          upstream={{ 'unknown' if _failed else _upstream }},
          status={{ 'UNKNOWN' if _failed
                    else ('UP TO DATE' if _pinned == _upstream else 'STALE') }}
      loop: "{{ _tools.keys() | list }}"
      loop_control:
        loop_var: _name
        label: "{{ _name }}"

    - name: Collect the tools whose pin is stale
      vars:
        _upstream: "{{ _fetch_results[_name].version | default('') }}"
        _pinned: "{{ _current[_name][_tools[_name].current_pin] }}"
      ansible.builtin.set_fact:
        _stale_tools: >-
          {{ (_stale_tools | default([]))
             + ([_name] if ((_upstream | length) > 0 and _pinned != _upstream) else []) }}
      loop: "{{ _tools.keys() | list }}"
      loop_control:
        loop_var: _name
        label: "{{ _name }}"

    - name: Report the tools that could not be queried
      # Renders the same report perform-updates.yml renders, and ends the play
      # non-zero: an outage must not read as success.
      ansible.builtin.include_tasks: tasks/report-update-failures.yml
      when: _update_failures | length > 0

    - name: Fail if any version pin is stale
      ansible.builtin.fail:
        msg: >-
          Stale: {{ _stale_tools | default([]) | join(', ') }}.
          Run perform-updates.yml to apply the updates.
      when: (_stale_tools | default([])) | length > 0

    - name: Report that every pin is current
      ansible.builtin.debug:
        msg: "All {{ _tools | length }} tracked pins are up to date."
