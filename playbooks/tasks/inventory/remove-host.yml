# Removes one host from every group of an autogenerated inventory.
#
# Required vars:
#   current_inventory - the autogenerated inventory as loaded by include_vars
#   hostname          - the host to remove
#
# Sets cleaned_inventory. Every top-level group of current_inventory is kept,
# including groups that only some hosts opt into, so destroying one host
# never drops another host's group membership. A group's children and vars
# are kept; an empty group (hosts: null) comes back as hosts: {}.
---
- name: Start from an empty cleaned inventory
  ansible.builtin.set_fact:
    cleaned_inventory: {}

- name: Copy each group without the destroyed host
  ansible.builtin.set_fact:
    cleaned_inventory: >-
      {{
        cleaned_inventory | combine({
          item.key: (item.value | default({}, true)) | combine({
            'hosts': ((item.value | default({}, true)).hosts | default({}, true)
                      | dict2items | rejectattr('key', 'equalto', hostname)
                      | items2dict)
          })
        })
      }}
  loop: "{{ current_inventory | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
