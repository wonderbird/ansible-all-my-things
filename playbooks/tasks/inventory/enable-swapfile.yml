# Opts an existing Linux VM into the swapfile group of its autogenerated
# inventory, so the next configure-profile.yml run gives it a swap file.
# Changes only the inventory file, never the VM.
#
# Required vars:
#   autogenerated_inventory_file - path of the provider's autogenerated
#                                  inventory
#   hostname                     - the VM to opt in
#   swap_size_gb                 - swap file size in GB, already validated by
#                                  assert-provider-profile.yml
---
- name: Check that the autogenerated inventory exists
  ansible.builtin.stat:
    path: "{{ autogenerated_inventory_file }}"
  register: enable_swapfile_inventory_stat

- name: Fail if the autogenerated inventory is missing
  ansible.builtin.fail:
    msg: >-
      {{ autogenerated_inventory_file }} does not exist, so it holds no VM
      named '{{ hostname }}'. Check provider and hostname.
  when: not enable_swapfile_inventory_stat.stat.exists

- name: Load the autogenerated inventory
  ansible.builtin.include_vars:
    file: "{{ autogenerated_inventory_file }}"
    name: current_inventory

# Windows hosts appear in all.hosts too; only members of linux can swap.
- name: Assert the VM is a Linux host of this inventory
  ansible.builtin.assert:
    that: hostname in ((current_inventory.linux | default({}, true)).hosts | default({}, true))
    fail_msg: >-
      '{{ hostname }}' is not a Linux host in {{ autogenerated_inventory_file }}.
      Only Linux VMs created by create-vm.yml can get a swap file.

- name: Read the swap file size the VM already opted into
  ansible.builtin.set_fact:
    enable_swapfile_current_size: >-
      {{ ((((current_inventory.swapfile | default({}, true)).hosts | default({}, true))[hostname]
          | default({}, true)).swapfile_size_gb | default('')) | string }}

# Same rule as the swapfile role: resizing an active swap file is manual.
- name: Fail if the VM already opted into a different size
  ansible.builtin.assert:
    that: >-
      enable_swapfile_current_size == ''
      or enable_swapfile_current_size | int == swap_size_gb | int
    fail_msg: >-
      '{{ hostname }}' already has swap_size_gb={{ enable_swapfile_current_size }}
      in {{ autogenerated_inventory_file }}, not {{ swap_size_gb }}. Resizing
      is not supported: keep the current size or re-create the VM.

- name: Start from the current inventory
  ansible.builtin.set_fact:
    updated_inventory: "{{ current_inventory }}"

- name: Add the VM to the swapfile group
  ansible.builtin.include_tasks: add-optional-groups.yml

- name: Write the autogenerated inventory
  ansible.builtin.copy:
    content: "# AUTO-GENERATED — do not edit manually. Overwritten by create-vm.yml and destroy-vm.yml.\n{{ updated_inventory | to_nice_yaml(indent=2) }}"
    dest: "{{ autogenerated_inventory_file }}"
    mode: "0644"

- name: Print the next step
  ansible.builtin.debug:
    msg: >-
      '{{ hostname }}' is in the swapfile group with swap_size_gb={{ swap_size_gb | int }}.
      Create the swap file with `ansible-playbook playbooks/configure-profile.yml --limit {{ hostname }}`
      or `./scripts/run-role.sh {{ hostname }} swapfile`.
