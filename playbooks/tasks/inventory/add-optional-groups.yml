# Adds one host to the cross-cutting groups it opts into. These groups are
# orthogonal to the provider and profile groups (see ADR-005), so any host
# may join them in addition to its other groups.
#
# Required vars:
#   updated_inventory  - the autogenerated inventory, already containing the
#                        host's provider and profile group entries
#   hostname           - the host to add
#   claude_opinionated - optional; true adds the host to claude_opinionated
#   swap_size_gb       - optional; a validated size in GB adds the host to
#                        swapfile with host var swapfile_size_gb
#
# Updates updated_inventory in place.
---
- name: Add host to the claude_opinionated group
  ansible.builtin.set_fact:
    updated_inventory: >-
      {{ updated_inventory | combine({'claude_opinionated': {'hosts': {hostname: {}}}}, recursive=true) }}
  when: claude_opinionated | default(false) | bool

# The size is stored as an integer: extra-vars arrive as strings, and the
# swapfile role computes the file size in bytes from it.
- name: Add host to the swapfile group with its swap file size
  ansible.builtin.set_fact:
    updated_inventory: >-
      {{ updated_inventory | combine({'swapfile': {'hosts': {hostname: {'swapfile_size_gb': swap_size_gb | int}}}}, recursive=true) }}
  when: swap_size_gb is defined
