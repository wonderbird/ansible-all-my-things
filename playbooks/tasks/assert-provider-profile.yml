---
- name: Assert provider is supported
  ansible.builtin.assert:
    that: provider in ['tart', 'docker', 'hcloud', 'aws']
    fail_msg: >-
      Unsupported provider '{{ provider }}'. Allowed values: tart, docker, hcloud, aws.
      {{ assert_provider_usage_hint }}

# profile is only defined by create-vm.yml (default basic). destroy-vm.yml
# shares this task file but never sets profile, so these checks are skipped
# there — destroy infers profile group membership from the inventory instead.
- name: Assert profile is supported
  ansible.builtin.assert:
    that: profile in ['basic', 'desktop', 'windows']
    fail_msg: >-
      Unsupported profile '{{ profile }}'. Allowed values: basic, desktop, windows.
  when: profile is defined

- name: Assert claude_opinionated is a boolean when defined
  ansible.builtin.assert:
    that: claude_opinionated in [true, false, 'true', 'false']
    fail_msg: >-
      claude_opinionated must be a boolean (true/false). Got:
      '{{ claude_opinionated }}'.
  when: claude_opinionated is defined

# swap_size_gb is only defined by create-vm.yml and enable-swapfile.yml.
# Extra-vars arrive as strings, so the check matches the text, not the type.
- name: Assert swap_size_gb is a positive whole number of gigabytes
  ansible.builtin.assert:
    that: swap_size_gb | string is match('^[1-9][0-9]*$')
    fail_msg: >-
      swap_size_gb must be a positive whole number of gigabytes, e.g. 2 or
      16. Got: '{{ swap_size_gb }}'.
  when: swap_size_gb is defined

- name: Reject a swap file on provider=docker
  ansible.builtin.fail:
    msg: >-
      Unsupported combination: swap_size_gb is set, but provider=docker
      cannot activate a swap file (a container may not run swapon). Omit
      swap_size_gb for docker.
  when: swap_size_gb is defined and provider == 'docker'

- name: Reject a swap file on a Windows profile
  ansible.builtin.fail:
    msg: >-
      Unsupported combination: swap_size_gb is set, but profile=windows has
      no Linux swap file. Omit swap_size_gb for Windows VMs.
  when: swap_size_gb is defined and profile is defined and profile == 'windows'

- name: Reject unsupported provider/profile combination
  ansible.builtin.fail:
    msg: >-
      Unsupported combination: provider=docker is incompatible with
      profile=desktop (the minimized docker image has no desktop support).
      Use provider=tart, hcloud, or aws for a desktop VM.
  when: profile is defined and provider == 'docker' and profile == 'desktop'

- name: Reject profile=windows on a non-AWS provider
  ansible.builtin.fail:
    msg: >-
      Unsupported combination: provider={{ provider }} is incompatible with
      profile=windows (Windows is only supported on provider=aws).
  when: profile is defined and profile == 'windows' and provider != 'aws'
