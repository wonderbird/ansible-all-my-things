---
- name: Preflight — assert base topology is loaded
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Fail loud if linux hosts exist but base group is empty/undefined
      ansible.builtin.fail:
        msg: >-
          The 'base' group is empty or undefined while 'linux' hosts are present.
          configure-profile.yml MUST run against the directory inventory
          (ansible.cfg: inventory = ./inventories) so inventories/base.yml is
          merged. Do NOT pass -i inventories/<provider>_autogenerated.yml (a
          single file), which omits base.yml and would silently skip all base
          roles.
      when:
        - groups.get('linux', []) | length > 0
        - groups.get('base', []) | length == 0

- import_playbook: setup-users.yml
- import_playbook: setup-basics.yml

# Desktop profile only (FR-005, FR-012): verbatim-imported, unmodified,
# scoped to the desktop group so basic-profile hosts are never affected.
- import_playbook: setup-desktop.yml
  when: "'desktop' in group_names"
- import_playbook: setup-keyring.yml
  when: "'desktop' in group_names"
- import_playbook: setup-desktop-apps.yml
  when: "'desktop' in group_names"

# Apply linux roles
- import_playbook: configure-profile-roles.yml

# Windows profile only: verbatim-imported, unmodified, already scoped to
# the windows group (hosts: windows) so linux/basic/desktop hosts are never
# affected.
- import_playbook: ../setup-roles-windows.yml

# Finally, reboot the system if required
- import_playbook: reboot-if-required.yml
