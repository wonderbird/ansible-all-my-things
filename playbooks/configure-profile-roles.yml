---
- name: Configure basic profile linux roles
  hosts: basic
  become: true

  vars:
    ansible_user: "{{ my_ansible_user }}"
    desktop_user_names: "{{ desktop_users | map(attribute='name') | list }}"

  roles:
    - podman
    - tmux
    - ruby
    - vim
    - python
    - dolt_sql_server
    - rtk
    - beads_go
    - beads_viewer
    - beads_rust
    - specify_cli
    - nodejs
    - ai_agent_workspace
    - claude_code
    - claude_code_config
    - opencode
    - github_cli

- name: Configure desktop profile linux roles
  hosts: desktop
  become: true

  vars:
    ansible_user: "{{ my_ansible_user }}"
    desktop_user_names: "{{ desktop_users | map(attribute='name') | list }}"

  # The basic and desktop plays share a number of roles verbatim;
  # desktop additionally adds roles requiring a desktop environment. This is
  # an accepted Principle II/XI (role-organisation/DRY) exception.
  # The desktop group is the switch; no when: needed.
  roles:
    - podman
    - ruby
    - vim
    - python
    - rtk
    - beads_go
    - beads_viewer
    - beads_rust
    - specify_cli
    - nodejs
    - ai_agent_workspace
    - claude_code
    - claude_code_config
    - opencode
    - tmux
    - nerd_font
    - dolt_sql_server
    - github_cli
    - role: google_chrome
      tags: not-supported-on-arm64
    - role: obsidian
      tags: not-supported-on-arm64
