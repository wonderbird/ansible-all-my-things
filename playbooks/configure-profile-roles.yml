---
- name: Configure base profile linux roles
  hosts: base
  become: true

  vars:
    ansible_user: "{{ my_ansible_user }}"
    desktop_user_names: "{{ desktop_users | map(attribute='name') | list }}"

  roles:
    - podman
    - tmux
    - ruby
    - vim
    - python
    - dolt_sql_server
    - rtk
    - beads_go
    - beads_viewer
    - beads_rust
    - specify_cli
    - nodejs
    - ai_agent_workspace
    - claude_code
    - claude_code_config
    - opencode
    - github_cli

- name: Configure desktop-only linux roles
  hosts: desktop
  become: true

  vars:
    ansible_user: "{{ my_ansible_user }}"
    desktop_user_names: "{{ desktop_users | map(attribute='name') | list }}"

  roles:
    - nerd_font
    - role: google_chrome
      tags: not-supported-on-arm64
    - role: obsidian
      tags: not-supported-on-arm64
